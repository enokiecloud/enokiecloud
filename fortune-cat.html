<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>fortune cat ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Gaegu:wght@300;400;700&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
      --line: #cfcac2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 18px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo-wrap {
      width: 245px;
      max-width: 42vw;
    }

    .logo-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(980px, 90%);
      margin: auto;
      padding: 55px 0 45px;
    }

    .intro {
      text-align: center;
    }

    .tiny-label {
      color: var(--soft);
      font-size: 7px;
      letter-spacing: 3px;
    }

    h1 {
      margin-top: 10px;

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(58px, 7vw, 84px);
      font-weight: 500;
      line-height: .95;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 9px;

      color: #55514d;

      font-family: "Gaegu", cursive;
      font-size: 20px;
    }

    .fortune-stage {
      width: min(760px, 100%);
      min-height: 560px;

      margin: 18px auto 0;

      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .cat-zone {
      width: 390px;
      max-width: 90vw;
      height: 365px;

      position: relative;

      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .pspsps {
      position: absolute;
      left: -25px;
      top: 85px;

      width: 120px;

      color: #55514d;

      font-family: "Gaegu", cursive;
      font-size: 18px;
      line-height: 1.1;

      transform: rotate(-8deg);

      transition: opacity .25s ease;
    }

    .pspsps.hidden {
      opacity: 0;
    }

    .cat-note {
      position: absolute;
      right: -10px;
      top: 125px;

      color: var(--soft);

      font-family: "Gaegu", cursive;
      font-size: 15px;

      transform: rotate(6deg);
    }

    .fortune-cat-button {
      position: relative;
      z-index: 5;

      border: 0;
      background: transparent;

      padding: 0;

      cursor: pointer;
    }

    .fortune-cat {
      width: 285px;
      max-width: 70vw;
      height: auto;

      display: block;

      mix-blend-mode: multiply;

      transition: transform .2s ease;
    }

    .fortune-cat-button:hover .fortune-cat {
      transform: translateY(-3px) rotate(-1deg);
    }

    .fortune-cat.wiggle {
      animation: catWiggle .55s ease;
    }

    @keyframes catWiggle {
      0% {
        transform: rotate(0deg) translateY(0);
      }

      20% {
        transform: rotate(-4deg) translateY(-4px);
      }

      40% {
        transform: rotate(4deg) translateY(-7px);
      }

      60% {
        transform: rotate(-3deg) translateY(-5px);
      }

      80% {
        transform: rotate(2deg) translateY(-2px);
      }

      100% {
        transform: rotate(0deg) translateY(0);
      }
    }

    .tap-label {
      position: absolute;
      bottom: 4px;

      color: #55514d;

      font-family: "Gaegu", cursive;
      font-size: 17px;

      transition: opacity .2s ease;
    }

    .fortune-paper {
      width: min(570px, 92%);
      min-height: 135px;

      margin-top: -8px;
      padding: 22px 28px 18px;

      background: #fffefb;

      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);

      position: relative;
      z-index: 2;

      opacity: 0;
      transform:
        translateY(-70px)
        rotate(-2deg)
        scale(.92);

      pointer-events: none;

      transition:
        opacity .35s ease,
        transform .45s cubic-bezier(.2,.8,.2,1);
    }

    .fortune-paper.show {
      opacity: 1;

      transform:
        translateY(0)
        rotate(var(--fortune-rotation, -1deg))
        scale(1);

      pointer-events: auto;
    }

    .fortune-paper::before {
      content: "";
      position: absolute;

      left: 0;
      top: 7px;
      bottom: 7px;

      border-left: 1px dashed #aaa49d;
    }

    .fortune-paper::after {
      content: "";
      position: absolute;

      right: 0;
      top: 7px;
      bottom: 7px;

      border-right: 1px dashed #aaa49d;
    }

    .fortune-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 11px;

      color: var(--soft);

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      letter-spacing: 1.5px;
    }

    .fortune {
      padding: 3px 12px 5px;

      font-family: "Gaegu", cursive;
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 400;
      line-height: 1.12;
      text-align: center;
    }

    .fortune-bottom {
      margin-top: 11px;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      color: var(--soft);
    }

    .lucky-number {
      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      letter-spacing: 1px;
    }

    .cat-verdict {
      font-family: "Gaegu", cursive;
      font-size: 15px;

      transform: rotate(-2deg);
    }

    .again-row {
      min-height: 55px;
      margin-top: 14px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }

    .again {
      border: 0;
      background: transparent;

      padding: 5px 2px;

      font-family: "Gaegu", cursive;
      font-size: 19px;

      cursor: pointer;

      opacity: 0;
      pointer-events: none;

      position: relative;

      transition:
        opacity .25s ease,
        transform .2s ease;
    }

    .again::after {
      content: "";

      width: 100%;
      height: 1px;

      position: absolute;
      left: 0;
      bottom: 1px;

      background: var(--ink);

      transform: rotate(-2deg);
    }

    .again.show {
      opacity: 1;
      pointer-events: auto;
    }

    .again:hover {
      transform: rotate(-3deg) scale(1.05);
    }

    .bother-count {
      color: var(--soft);

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      letter-spacing: .5px;

      opacity: 0;

      transition: opacity .25s ease;
    }

    .bother-count.show {
      opacity: 1;
    }

    .tiny-warning {
      width: max-content;
      max-width: 100%;

      margin: 10px 0 0 auto;

      color: var(--soft);

      font-family: "Gaegu", cursive;
      font-size: 15px;

      transform: rotate(2deg);
    }

    .bottom {
      width: min(980px, 90%);
      margin: 0 auto 40px;
      padding-top: 18px;

      border-top: 1px solid var(--ink);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bottom a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .bottom a:hover {
      font-style: italic;
    }

    .bottom-note {
      color: var(--soft);

      font-family: "Gaegu", cursive;
      font-size: 16px;

      transform: rotate(-1deg);
    }

    @media (max-width: 650px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo-wrap {
        width: 220px;
        max-width: 90%;
      }

      main {
        padding-top: 45px;
      }

      .fortune-stage {
        min-height: 520px;
      }

      .cat-zone {
        width: 100%;
        height: 330px;
      }

      .fortune-cat {
        width: 245px;
      }

      .pspsps {
        left: 0;
        top: 60px;

        width: 85px;

        font-size: 15px;
      }

      .cat-note {
        right: 0;
        top: 100px;

        font-size: 13px;
      }

      .fortune-paper {
        margin-top: -2px;
        padding-left: 19px;
        padding-right: 19px;
      }

      .fortune {
        font-size: 26px;
      }

      .fortune-top {
        gap: 15px;
      }

      .bottom {
        gap: 20px;
        align-items: flex-end;
      }

      .bottom-note {
        text-align: right;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo-wrap">
      <img
        src="images/enokiecloud-logo.png"
        alt="enokiecloud"
        class="logo-image"
      >
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
    </div>

  </nav>

  <main>

    <section class="intro">

      <p class="tiny-label">
        ASK WISELY
      </p>

      <h1>
        fortune cat
      </h1>

      <p class="subtitle">
        he knows things... allegedly
      </p>

    </section>

    <section class="fortune-stage">

      <div class="cat-zone">

        <p
          class="pspsps"
          id="pspsps"
        >
          pspsps...<br>
          ask me something
        </p>

        <p class="cat-note">
          don't be shy
        </p>

        <button
          class="fortune-cat-button"
          id="fortuneCatButton"
          type="button"
          aria-label="ask fortune cat"
        >
          <img
            src="images/fortune%20cat.jpg"
            alt="fortune cat"
            class="fortune-cat"
            id="fortuneCat"
          >
        </button>

        <p
          class="tap-label"
          id="tapLabel"
        >
          tap the cat
        </p>

      </div>

      <div
        class="fortune-paper"
        id="fortunePaper"
      >

        <div class="fortune-top">

          <span>
            FORTUNE NO.
            <span id="fortuneNumber">001</span>
          </span>

          <span>
            ENOKIECLOUD
          </span>

        </div>

        <p
          class="fortune"
          id="fortune"
        >
        </p>

        <div class="fortune-bottom">

          <span
            class="lucky-number"
            id="luckyNumber"
          >
            lucky no. 7
          </span>

          <span
            class="cat-verdict"
            id="catVerdict"
          >
            cat approved
          </span>

        </div>

      </div>

      <div class="again-row">

        <button
          class="again"
          id="againButton"
          type="button"
        >
          ask him again
        </button>

        <span
          class="bother-count"
          id="botherCount"
        >
          cat bothered: 0 times
        </span>

      </div>

      <p class="tiny-warning">
        results may be suspiciously specific
      </p>

    </section>

  </main>

  <div class="bottom">

    <a href="index.html">
      ← back home
    </a>

    <span class="bottom-note">
      don't blame the cat if u don't like ur answer
    </span>

  </div>

  <script>
    const fortuneCatButton =
      document.getElementById("fortuneCatButton");

    const fortuneCat =
      document.getElementById("fortuneCat");

    const fortunePaper =
      document.getElementById("fortunePaper");

    const fortune =
      document.getElementById("fortune");

    const fortuneNumber =
      document.getElementById("fortuneNumber");

    const luckyNumber =
      document.getElementById("luckyNumber");

    const catVerdict =
      document.getElementById("catVerdict");

    const againButton =
      document.getElementById("againButton");

    const botherCount =
      document.getElementById("botherCount");

    const tapLabel =
      document.getElementById("tapLabel");

    const pspsps =
      document.getElementById("pspsps");

    const fortunes = [
      "something good is already making its way to u",
      "ur overthinking again",
      "yes. that's ur sign.",
      "trust ur gut this time",
      "go buy yourself a little treat",
      "today is giving side quest energy",
      "stop checking. it'll happen when it happens.",
      "you already know the answer",
      "maybe sleep on it first",
      "something small is about to make u really happy",
      "don't force what isn't flowing",
      "ur allowed to change ur mind",
      "the thing ur worried about will feel smaller soon",
      "say yes to the weird little opportunity",
      "someone is thinking about u",
      "leave it alone for today",
      "good news likes to arrive unexpectedly",
      "take the compliment and stop arguing",
      "ur doing better than u think",
      "don't text them rn lol",
      "actually... go for it",
      "not everything needs to be figured out tonight",
      "ur next favorite memory hasn't happened yet",
      "something u thought was over might surprise u",
      "be nosy. investigate.",
      "today calls for a little treat",
      "wait a little longer",
      "the answer is probably simpler than ur making it",
      "keep that idea. there's something there.",
      "the cat says absolutely not.",
      "hmm... maybe mind ur business for this one",
      "ur gonna laugh about this later",
      "do it for the plot",
      "the answer is yes but don't make it weird",
      "something u've been waiting on is shifting",
      "let them miss u a little",
      "one more day. then decide.",
      "don't ruin a good thing by overthinking it",
      "the cat thinks u deserve better",
      "ur intuition clocked it before u did"
    ];

    const verdicts = [
      "cat approved",
      "hmm... interesting",
      "he seems confident",
      "don't question him",
      "probably true",
      "he knows.",
      "take it or leave it",
      "very serious business",
      "his final answer",
      "apparently."
    ];

    const rotations = [
      "-2deg",
      "-1.3deg",
      "-0.5deg",
      "0.6deg",
      "1.2deg",
      "2deg"
    ];

    let lastFortune = -1;
    let timesBothered = 0;
    let fortuneCount = 0;

    function giveFortune() {

      fortuneCat.classList.remove("wiggle");

      void fortuneCat.offsetWidth;

      fortuneCat.classList.add("wiggle");

      fortunePaper.classList.remove("show");
      againButton.classList.remove("show");

      tapLabel.textContent = "...";

      pspsps.classList.add("hidden");

      let randomIndex;

      do {
        randomIndex =
          Math.floor(Math.random() * fortunes.length);
      } while (
        randomIndex === lastFortune &&
        fortunes.length > 1
      );

      lastFortune = randomIndex;

      timesBothered++;
      fortuneCount++;

      const randomLucky =
        Math.floor(Math.random() * 98) + 1;

      const randomVerdict =
        verdicts[
          Math.floor(Math.random() * verdicts.length)
        ];

      const randomRotation =
        rotations[
          Math.floor(Math.random() * rotations.length)
        ];

      setTimeout(() => {

        fortune.textContent =
          fortunes[randomIndex];

        fortuneNumber.textContent =
          String(fortuneCount).padStart(3, "0");

        luckyNumber.textContent =
          "lucky no. " + randomLucky;

        catVerdict.textContent =
          randomVerdict;

        fortunePaper.style.setProperty(
          "--fortune-rotation",
          randomRotation
        );

        fortunePaper.classList.add("show");

        againButton.classList.add("show");

        botherCount.textContent =
          "cat bothered: " +
          timesBothered +
          (
            timesBothered === 1
              ? " time"
              : " times"
          );

        botherCount.classList.add("show");

        tapLabel.textContent =
          "he has spoken";

      }, 420);
    }

    fortuneCatButton.addEventListener(
      "click",
      giveFortune
    );

    againButton.addEventListener(
      "click",
      giveFortune
    );
  </script>

</body>
</html>
