<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>lost & found ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
      --line: #d8d3cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 18px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo-wrap {
      width: 245px;
      max-width: 42vw;
    }

    .logo-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(1000px, 90%);
      margin: auto;
      padding: 62px 0 90px;
    }

    .intro {
      margin-bottom: 34px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(54px, 8vw, 84px);
      font-weight: 500;
      line-height: .95;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--soft);
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      font-style: italic;
    }

    .tiny-note {
      margin-top: 9px;
      color: var(--soft);
      font-size: 7px;
      line-height: 1.6;
    }

    .found-field {
      position: relative;
      min-height: 630px;
      margin-top: 34px;

      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      overflow: hidden;
    }

    .found-object {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition:
        transform .2s ease,
        opacity .2s ease;
    }

    .found-object:hover {
      transform: translateY(-3px) rotate(-1deg);
    }

    .found-object:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 7px;
    }

    .object-label {
      display: block;
      margin-top: 7px;
      color: var(--soft);
      font-size: 6px;
      text-align: center;
      letter-spacing: .03em;
    }

    /* key */
    .key {
      left: 8%;
      top: 14%;
      transform: rotate(-9deg);
    }

    .key-shape {
      position: relative;
      width: 76px;
      height: 27px;
    }

    .key-shape::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 20px;
      height: 20px;
      border: 2px solid var(--ink);
      border-radius: 50%;
    }

    .key-shape::after {
      content: "";
      position: absolute;
      left: 19px;
      top: 11px;
      width: 52px;
      height: 2px;
      background: var(--ink);
      box-shadow:
        36px 5px 0 -0.5px var(--ink),
        44px 5px 0 -0.5px var(--ink);
    }

    /* receipt */
    .receipt {
      right: 12%;
      top: 9%;
      transform: rotate(4deg);
    }

    .receipt-shape {
      width: 72px;
      min-height: 116px;
      padding: 12px 9px;
      border: 1px solid var(--ink);
      background: var(--paper);
    }

    .receipt-line {
      display: block;
      height: 1px;
      margin-bottom: 8px;
      background: var(--line);
    }

    .receipt-line.short {
      width: 62%;
    }

    /* hair tie */
    .hair-tie {
      left: 37%;
      top: 29%;
      transform: rotate(15deg);
    }

    .hair-tie-shape {
      width: 58px;
      height: 58px;
      border: 6px solid var(--ink);
      border-radius: 50%;
    }

    /* photo */
    .photo {
      right: 28%;
      top: 36%;
      transform: rotate(-7deg);
    }

    .photo-shape {
      width: 108px;
      height: 128px;
      border: 1px solid var(--ink);
      background: var(--paper);
      padding: 8px 8px 25px;
    }

    .photo-inner {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      background:
        linear-gradient(
          135deg,
          transparent 46%,
          var(--line) 47%,
          var(--line) 49%,
          transparent 50%
        );
    }

    /* button */
    .button-object {
      left: 18%;
      bottom: 15%;
      transform: rotate(7deg);
    }

    .button-shape {
      position: relative;
      width: 48px;
      height: 48px;
      border: 2px solid var(--ink);
      border-radius: 50%;
    }

    .button-shape::before,
    .button-shape::after {
      content: "";
      position: absolute;
      top: 17px;
      width: 5px;
      height: 5px;
      border: 1px solid var(--ink);
      border-radius: 50%;
    }

    .button-shape::before {
      left: 14px;
    }

    .button-shape::after {
      right: 14px;
    }

    /* folded note */
    .note-object {
      right: 7%;
      bottom: 17%;
      transform: rotate(10deg);
    }

    .note-shape {
      position: relative;
      width: 108px;
      height: 74px;
      border: 1px solid var(--ink);
      background: var(--paper);
    }

    .note-shape::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(
          35deg,
          transparent 49%,
          var(--line) 50%,
          transparent 51%
        );
      opacity: .8;
    }

    /* coin */
    .coin {
      left: 52%;
      bottom: 10%;
      transform: rotate(-4deg);
    }

    .coin-shape {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      font-family: "Cormorant Garamond", serif;
      font-size: 20px;
    }

    .detail-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(360px, 82%);
      transform: translate(-50%, -50%);

      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 26px 24px 22px;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .detail-panel.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%) translateY(-2px);
    }

    .detail-kicker {
      color: var(--soft);
      font-size: 7px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .detail-title {
      margin-top: 8px;
      font-family: "Cormorant Garamond", serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1;
    }

    .detail-body {
      margin-top: 14px;
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      line-height: 1.45;
    }

    .detail-meta {
      margin-top: 16px;
      color: var(--soft);
      font-size: 7px;
      line-height: 1.6;
    }

    .detail-close {
      margin-top: 20px;
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      padding: 2px 0;

      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      cursor: pointer;
    }

    .detail-close:hover {
      font-style: italic;
    }

    .back {
      display: inline-block;
      margin-top: 38px;
      font-size: 10px;
    }

    .back:hover {
      font-style: italic;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo-wrap {
        width: 220px;
        max-width: 90%;
      }

      main {
        padding-top: 50px;
      }

      .found-field {
        min-height: 720px;
      }

      .key {
        left: 5%;
        top: 10%;
      }

      .receipt {
        right: 4%;
        top: 8%;
      }

      .hair-tie {
        left: 20%;
        top: 35%;
      }

      .photo {
        right: 7%;
        top: 42%;
      }

      .button-object {
        left: 8%;
        bottom: 15%;
      }

      .coin {
        left: 45%;
        bottom: 8%;
      }

      .note-object {
        right: 4%;
        bottom: 14%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="logo-wrap">
      <img
        src="images/enokiecloud-logo.png"
        alt="enokiecloud"
        class="logo-image"
      >
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
      <a href="guestbook.html">guestbook</a>
    </div>
  </nav>

  <main>

    <section class="intro">
      <h1>lost & found</h1>

      <p class="subtitle">
        things that somehow ended up here.
      </p>

      <p class="tiny-note">
        click around ~ some of these have been sitting here for a while
      </p>
    </section>

    <section class="found-field" id="foundField">

      <button
        class="found-object key"
        type="button"
        data-item="key"
        aria-label="old key"
      >
        <span class="key-shape"></span>
        <span class="object-label">old key</span>
      </button>

      <button
        class="found-object receipt"
        type="button"
        data-item="receipt"
        aria-label="crumpled receipt"
      >
        <span class="receipt-shape">
          <span class="receipt-line"></span>
          <span class="receipt-line short"></span>
          <span class="receipt-line"></span>
          <span class="receipt-line short"></span>
          <span class="receipt-line"></span>
          <span class="receipt-line short"></span>
        </span>
        <span class="object-label">receipt</span>
      </button>

      <button
        class="found-object hair-tie"
        type="button"
        data-item="hairtie"
        aria-label="black hair tie"
      >
        <span class="hair-tie-shape"></span>
        <span class="object-label">hair tie</span>
      </button>

      <button
        class="found-object photo"
        type="button"
        data-item="photo"
        aria-label="old photo"
      >
        <span class="photo-shape">
          <span class="photo-inner"></span>
        </span>
        <span class="object-label">photo</span>
      </button>

      <button
        class="found-object button-object"
        type="button"
        data-item="button"
        aria-label="loose button"
      >
        <span class="button-shape"></span>
        <span class="object-label">button</span>
      </button>

      <button
        class="found-object note-object"
        type="button"
        data-item="note"
        aria-label="folded note"
      >
        <span class="note-shape"></span>
        <span class="object-label">folded note</span>
      </button>

      <button
        class="found-object coin"
        type="button"
        data-item="coin"
        aria-label="coin"
      >
        <span class="coin-shape">?</span>
        <span class="object-label">coin</span>
      </button>

      <div
        class="detail-panel"
        id="detailPanel"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
      >
        <p class="detail-kicker" id="detailKicker">
          found item
        </p>

        <h2 class="detail-title" id="detailTitle"></h2>

        <p class="detail-body" id="detailBody"></p>

        <p class="detail-meta" id="detailMeta"></p>

        <button
          class="detail-close"
          id="detailClose"
          type="button"
        >
          put it back
        </button>
      </div>

    </section>

    <a href="index.html" class="back">
      ← back home
    </a>

  </main>

  <script>
    const items = {
      key: {
        title: "old key",
        body:
          "doesn't fit anything i own. i tried. twice.",
        meta:
          "found: near the bottom drawer / status: unclaimed"
      },

      receipt: {
        title: "crumpled receipt",
        body:
          "the ink is almost gone. apparently somebody bought a drink, batteries, and one lemon.",
        meta:
          "found: inside a pocket / date: basically unreadable"
      },

      hairtie: {
        title: "black hair tie",
        body:
          "there are somehow always more of these and also never enough of them.",
        meta:
          "found: under the desk / owner: probably me tbh"
      },

      photo: {
        title: "old photo",
        body:
          "the picture is too faded to tell what's happening, but everybody looks happy.",
        meta:
          "found: between two books / no writing on the back"
      },

      button: {
        title: "loose button",
        body:
          "small, black, and definitely came off something important.",
        meta:
          "found: on the floor / nobody remembers losing it"
      },

      note: {
        title: "folded note",
        body:
          "it just says “don't forget” and gives absolutely no context. helpful.",
        meta:
          "found: tucked behind something / handwriting: unknown"
      },

      coin: {
        title: "weird coin",
        body:
          "not enough to buy anything. still feels wrong to throw it away.",
        meta:
          "found: couch cushion / value: emotionally significant apparently"
      }
    };

    const foundField =
      document.getElementById("foundField");

    const detailPanel =
      document.getElementById("detailPanel");

    const detailTitle =
      document.getElementById("detailTitle");

    const detailBody =
      document.getElementById("detailBody");

    const detailMeta =
      document.getElementById("detailMeta");

    const detailClose =
      document.getElementById("detailClose");

    const objectButtons =
      Array.from(
        document.querySelectorAll(
          ".found-object"
        )
      );

    let lastFocused =
      null;

    function openItem(itemKey) {
      const item =
        items[itemKey];

      if (!item) {
        return;
      }

      lastFocused =
        document.activeElement;

      detailTitle.textContent =
        item.title;

      detailBody.textContent =
        item.body;

      detailMeta.textContent =
        item.meta;

      detailPanel.classList.add(
        "show"
      );

      detailPanel.setAttribute(
        "aria-hidden",
        "false"
      );

      detailClose.focus();
    }

    function closeItem() {
      detailPanel.classList.remove(
        "show"
      );

      detailPanel.setAttribute(
        "aria-hidden",
        "true"
      );

      if (
        lastFocused &&
        typeof lastFocused.focus === "function"
      ) {
        lastFocused.focus();
      }
    }

    objectButtons.forEach((button) => {
      button.addEventListener(
        "click",
        () => {
          openItem(
            button.dataset.item
          );
        }
      );
    });

    detailClose.addEventListener(
      "click",
      closeItem
    );

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Escape" &&
          detailPanel.classList.contains(
            "show"
          )
        ) {
          closeItem();
        }
      }
    );
  </script>

</body>
</html>
