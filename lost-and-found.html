<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>lost & found ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #080807;
      --ink: #c8c3b8;
      --soft: #777269;
      --line: #3d3a35;
      --faint: #121210;
      --ghost: #918b80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.018), transparent 34%),
        radial-gradient(circle at 50% 60%, transparent 48%, rgba(0,0,0,.32) 100%),
        var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .08;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.03) 0,
          rgba(255,255,255,.03) 1px,
          transparent 1px,
          transparent 3px
        );
      mix-blend-mode: soft-light;
    }

    .logo-image {
      filter: invert(1) sepia(.12) brightness(.72) contrast(.88);
      opacity: .86;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 18px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--line);
    }

    .logo-wrap {
      width: 245px;
      max-width: 42vw;
    }

    .logo-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
      color: #aaa49a;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(1000px, 90%);
      margin: auto;
      padding: 62px 0 90px;
    }

    .intro {
      margin-bottom: 34px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(54px, 8vw, 84px);
      font-weight: 500;
      line-height: .95;
      color: #d1ccc2;
      text-shadow: 0 0 18px rgba(255,255,255,.02);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--soft);
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      font-style: italic;
    }

    .tiny-note {
      margin-top: 10px;
      color: var(--soft);
      font-size: 8px;
      line-height: 1.6;
    }

    .found-field {
      position: relative;
      min-height: 680px;
      margin-top: 34px;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .found-object {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      opacity: .78;

      transition:
        transform .22s ease,
        opacity .22s ease;
    }

    .found-object:hover {
      transform: translateY(-3px) rotate(-1deg);
      opacity: .82;
      filter: blur(.1px);
    }

    .found-object:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 8px;
    }

    .object-label {
      display: block;
      margin-top: 10px;
      color: #6f6a62;
      font-size: 9px;
      text-align: center;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    /* old key */
    .key {
      left: 7%;
      top: 14%;
      transform: rotate(-8deg);
    }

    .key-shape {
      position: relative;
      display: block;
      width: 106px;
      height: 34px;
    }

    .key-ring {
      position: absolute;
      left: 0;
      top: 3px;

      width: 28px;
      height: 28px;

      border: 2px solid var(--ghost);
      border-radius: 50%;
      background: transparent;
    }

    .key-ring::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 8px;

      width: 8px;
      height: 8px;

      border: 1px solid var(--ghost);
      border-radius: 50%;
    }

    .key-stem {
      position: absolute;
      left: 26px;
      top: 16px;

      width: 68px;
      height: 2px;
      background: var(--ghost);
    }

    .key-tooth-a,
    .key-tooth-b {
      position: absolute;
      width: 2px;
      background: var(--ghost);
    }

    .key-tooth-a {
      left: 77px;
      top: 16px;
      height: 11px;
    }

    .key-tooth-b {
      left: 90px;
      top: 16px;
      height: 8px;
    }

    .key-tip {
      position: absolute;
      left: 93px;
      top: 14px;

      width: 12px;
      height: 6px;

      border-top: 2px solid var(--ink);
      border-right: 2px solid var(--ink);
    }

    /* receipt */
    .receipt {
      right: 9%;
      top: 8%;
      transform: rotate(4deg);
    }

    .receipt-shape {
      position: relative;
      display: block;

      width: 98px;
      min-height: 146px;

      padding: 18px 13px 16px;

      border: 1px solid var(--ghost);
      background: #0b0b0a;

      box-shadow: 3px 4px 0 #030303;
    }

    .receipt-shape::before {
      content: "THANK U";
      display: block;
      margin-bottom: 13px;

      font-size: 7px;
      letter-spacing: .12em;
      text-align: center;
    }

    .receipt-shape::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;

      width: 100%;
      height: 8px;

      background:
        linear-gradient(135deg, transparent 4px, var(--paper) 0) 0 0/8px 8px repeat-x;
    }

    .receipt-line {
      display: block;
      height: 1px;
      margin-bottom: 9px;
      background: var(--line);
    }

    .receipt-line.short {
      width: 68%;
    }

    .receipt-total {
      display: block;
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 8px;

      font-size: 7px;
      text-align: right;
    }

    /* hair tie */
    .hair-tie {
      left: 35%;
      top: 30%;
      transform: rotate(15deg);
    }

    .hair-tie-shape {
      display: block;

      width: 78px;
      height: 68px;

      border: 8px solid var(--ink);
      border-radius: 48% 52% 46% 54% / 52% 46% 54% 48%;
    }

    /* polaroid */
    .photo {
      right: 27%;
      top: 35%;
      transform: rotate(-7deg);
    }

    .photo-shape {
      display: block;

      width: 132px;
      height: 160px;

      border: 1px solid var(--ghost);
      background: #0b0b0a;

      padding: 10px 10px 30px;

      box-shadow: 4px 4px 0 #030303;
    }

    .photo-inner {
      position: relative;
      display: block;

      width: 100%;
      height: 100%;

      overflow: hidden;
      border: 1px solid var(--line);

      background:
        linear-gradient(to bottom, #0c0c0b 0 50%, #141310 50% 100%);
    }

    .photo-inner::before {
      content: "";
      position: absolute;
      left: 15%;
      bottom: 14%;

      width: 28px;
      height: 42px;

      border: 1px solid var(--soft);
      border-radius: 48% 48% 42% 42%;
      opacity: .65;
    }

    .photo-inner::after {
      content: "";
      position: absolute;
      right: 14%;
      bottom: 12%;

      width: 35px;
      height: 50px;

      border: 1px solid var(--soft);
      border-radius: 50% 50% 44% 44%;
      opacity: .45;
    }

    /* loose button */
    .button-object {
      left: 17%;
      bottom: 14%;
      transform: rotate(7deg);
    }

    .button-shape {
      position: relative;
      display: block;

      width: 62px;
      height: 62px;

      border: 2px solid var(--ghost);
      border-radius: 50%;

      box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 6px var(--line);
    }

    .button-hole {
      position: absolute;

      width: 6px;
      height: 6px;

      border: 1px solid var(--ghost);
      border-radius: 50%;
    }

    .button-hole.one {
      left: 19px;
      top: 19px;
    }

    .button-hole.two {
      right: 19px;
      top: 19px;
    }

    .button-hole.three {
      left: 19px;
      bottom: 19px;
    }

    .button-hole.four {
      right: 19px;
      bottom: 19px;
    }

    /* folded note */
    .note-object {
      right: 6%;
      bottom: 15%;
      transform: rotate(9deg);
    }

    .note-shape {
      position: relative;
      display: block;

      width: 132px;
      height: 94px;

      border: 1px solid var(--ghost);
      background: #0b0b0a;

      box-shadow: 3px 3px 0 #030303;
    }

    .note-fold-one,
    .note-fold-two {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .note-fold-one::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          33deg,
          transparent 49.3%,
          var(--line) 49.7%,
          var(--line) 50.3%,
          transparent 50.7%
        );
    }

    .note-fold-two::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(
          -33deg,
          transparent 49.3%,
          var(--line) 49.7%,
          var(--line) 50.3%,
          transparent 50.7%
        );
    }

    .note-writing {
      position: absolute;
      left: 21px;
      top: 35px;

      width: 88px;

      font-family: "Cormorant Garamond", serif;
      font-size: 10px;
      font-style: italic;
      text-align: center;
    }

    /* coin */
    .coin {
      left: 52%;
      bottom: 10%;
      transform: rotate(-4deg);
    }

    .coin-shape {
      position: relative;

      display: grid;
      place-items: center;

      width: 58px;
      height: 58px;

      border: 2px solid var(--ghost);
      border-radius: 50%;

      font-family: "Cormorant Garamond", serif;
      font-size: 23px;
    }

    .coin-shape::after {
      content: "";
      position: absolute;
      inset: 5px;

      border: 1px solid var(--line);
      border-radius: 50%;
    }

    /* tiny earring */
    .earring {
      left: 50%;
      top: 13%;
      transform: rotate(-5deg);
    }

    .earring-shape {
      position: relative;
      display: block;

      width: 42px;
      height: 74px;
    }

    .earring-hook {
      position: absolute;
      left: 13px;
      top: 0;

      width: 17px;
      height: 27px;

      border: 1.5px solid var(--ghost);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      transform: rotate(18deg);
    }

    .earring-drop {
      position: absolute;
      left: 11px;
      bottom: 0;

      width: 20px;
      height: 29px;

      border: 1.5px solid var(--ghost);
      border-radius: 50% 50% 56% 44% / 45% 45% 55% 55%;
    }

    .earring-chain {
      position: absolute;
      left: 20px;
      top: 24px;

      width: 1px;
      height: 24px;

      background: var(--ghost);
    }

    .detail-panel {
      position: absolute;
      z-index: 20;

      left: 50%;
      top: 50%;

      width: min(380px, 84%);

      transform: translate(-50%, -50%);

      background: rgba(5, 5, 5, .98);
      border: 1px solid var(--ghost);
      padding: 28px 26px 24px;

      box-shadow: 8px 8px 0 #020202;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .detail-panel.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%) translateY(-2px);
    }

    .detail-kicker {
      color: var(--soft);
      font-size: 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .detail-title {
      margin-top: 8px;

      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1;
    }

    .detail-body {
      margin-top: 15px;

      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
      line-height: 1.45;
    }

    .detail-meta {
      margin-top: 17px;

      color: var(--soft);
      font-size: 8px;
      line-height: 1.7;
    }

    .detail-close {
      margin-top: 20px;

      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;

      padding: 2px 0;

      font-family: "Cormorant Garamond", serif;
      font-size: 17px;

      cursor: pointer;
    }

    .detail-close:hover {
      font-style: italic;
    }

    .back {
      display: inline-block;
      margin-top: 38px;
      font-size: 10px;
    }

    .back:hover {
      font-style: italic;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo-wrap {
        width: 220px;
        max-width: 90%;
      }

      main {
        padding-top: 50px;
      }

      .found-field {
        min-height: 860px;
      }

      .key {
        left: 4%;
        top: 8%;
      }

      .earring {
        left: 48%;
        top: 10%;
      }

      .receipt {
        right: 2%;
        top: 9%;
      }

      .hair-tie {
        left: 12%;
        top: 34%;
      }

      .photo {
        right: 4%;
        top: 38%;
      }

      .button-object {
        left: 7%;
        bottom: 14%;
      }

      .coin {
        left: 44%;
        bottom: 7%;
      }

      .note-object {
        right: 3%;
        bottom: 13%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="logo-wrap">
      <img
        src="images/enokiecloud-logo.png"
        alt="enokiecloud"
        class="logo-image"
      >
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
      <a href="guestbook.html">guestbook</a>
    </div>
  </nav>

  <main>

    <section class="intro">
      <h1>lost & found</h1>

      <p class="subtitle">
        things that somehow ended up here.
      </p>

      <p class="tiny-note">
        click around ~ some of these have been sitting here for a while
      </p>
    </section>

    <section class="found-field" id="foundField">

      <button
        class="found-object key"
        type="button"
        data-item="key"
        aria-label="old key"
      >
        <span class="key-shape">
          <span class="key-ring"></span>
          <span class="key-stem"></span>
          <span class="key-tooth-a"></span>
          <span class="key-tooth-b"></span>
          <span class="key-tip"></span>
        </span>
        <span class="object-label">old key</span>
      </button>

      <button
        class="found-object receipt"
        type="button"
        data-item="receipt"
        aria-label="crumpled receipt"
      >
        <span class="receipt-shape">
          <span class="receipt-line"></span>
          <span class="receipt-line short"></span>
          <span class="receipt-line"></span>
          <span class="receipt-line short"></span>
          <span class="receipt-line"></span>
          <span class="receipt-line short"></span>
          <span class="receipt-total">$ ?.??</span>
        </span>
        <span class="object-label">receipt</span>
      </button>

      <button
        class="found-object hair-tie"
        type="button"
        data-item="hairtie"
        aria-label="black hair tie"
      >
        <span class="hair-tie-shape"></span>
        <span class="object-label">hair tie</span>
      </button>

      <button
        class="found-object photo"
        type="button"
        data-item="photo"
        aria-label="old photo"
      >
        <span class="photo-shape">
          <span class="photo-inner"></span>
        </span>
        <span class="object-label">old photo</span>
      </button>

      <button
        class="found-object button-object"
        type="button"
        data-item="button"
        aria-label="loose button"
      >
        <span class="button-shape">
          <span class="button-hole one"></span>
          <span class="button-hole two"></span>
          <span class="button-hole three"></span>
          <span class="button-hole four"></span>
        </span>
        <span class="object-label">loose button</span>
      </button>

      <button
        class="found-object note-object"
        type="button"
        data-item="note"
        aria-label="folded note"
      >
        <span class="note-shape">
          <span class="note-fold-one"></span>
          <span class="note-fold-two"></span>
          <span class="note-writing">don't forget</span>
        </span>
        <span class="object-label">folded note</span>
      </button>

      <button
        class="found-object coin"
        type="button"
        data-item="coin"
        aria-label="weird coin"
      >
        <span class="coin-shape">?</span>
        <span class="object-label">weird coin</span>
      </button>

      <button
        class="found-object earring"
        type="button"
        data-item="earring"
        aria-label="single earring"
      >
        <span class="earring-shape">
          <span class="earring-hook"></span>
          <span class="earring-chain"></span>
          <span class="earring-drop"></span>
        </span>
        <span class="object-label">single earring</span>
      </button>

      <div
        class="detail-panel"
        id="detailPanel"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
      >
        <p class="detail-kicker">
          found item
        </p>

        <h2 class="detail-title" id="detailTitle"></h2>

        <p class="detail-body" id="detailBody"></p>

        <p class="detail-meta" id="detailMeta"></p>

        <button
          class="detail-close"
          id="detailClose"
          type="button"
        >
          put it back
        </button>
      </div>

    </section>

    <a href="index.html" class="back">
      ← back home
    </a>

  </main>

  <audio id="nightCrickets" preload="auto" loop>
    <source src="sounds/crickets.mp3" type="audio/mpeg">
  </audio>

  <script>
    const nightCrickets =
      document.getElementById("nightCrickets");

    nightCrickets.volume = 0.22;

    let cricketAudioUnlocked = false;

    async function startCrickets() {
      try {
        nightCrickets.currentTime = 0;
        await nightCrickets.play();
        cricketAudioUnlocked = true;
      } catch (error) {
        // browsers may block autoplay until the visitor interacts
      }
    }

    function stopCrickets() {
      nightCrickets.pause();
      nightCrickets.currentTime = 0;
    }

    document.addEventListener(
      "pointerdown",
      () => {
        if (
          !cricketAudioUnlocked &&
          !document.hidden
        ) {
          startCrickets();
        }
      },
      { once: true }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          stopCrickets();
        } else if (cricketAudioUnlocked) {
          startCrickets();
        }
      }
    );

    window.addEventListener(
      "pagehide",
      stopCrickets
    );

    const items = {
      key: {
        title: "old key",
        body:
          "doesn't fit anything i own. i tried. twice.",
        meta:
          "found: near the bottom drawer / status: unclaimed"
      },

      receipt: {
        title: "crumpled receipt",
        body:
          "the ink is almost gone. apparently somebody bought a drink, batteries, and one lemon.",
        meta:
          "found: inside a pocket / date: basically unreadable"
      },

      hairtie: {
        title: "black hair tie",
        body:
          "there are somehow always more of these and also never enough of them.",
        meta:
          "found: under the desk / owner: probably me tbh"
      },

      photo: {
        title: "old photo",
        body:
          "the picture is too faded to tell what's happening, but everybody looks happy.",
        meta:
          "found: between two books / no writing on the back"
      },

      button: {
        title: "loose button",
        body:
          "small, black, and definitely came off something important.",
        meta:
          "found: on the floor / nobody remembers losing it"
      },

      note: {
        title: "folded note",
        body:
          "it just says “don't forget” and gives absolutely no context. helpful.",
        meta:
          "found: tucked behind something / handwriting: unknown"
      },

      coin: {
        title: "weird coin",
        body:
          "not enough to buy anything. still feels wrong to throw it away.",
        meta:
          "found: couch cushion / value: emotionally significant apparently"
      },

      earring: {
        title: "single earring",
        body:
          "the other one is nowhere to be found. naturally.",
        meta:
          "found: beside the bed / pair status: complicated"
      }
    };

    const detailPanel =
      document.getElementById("detailPanel");

    const detailTitle =
      document.getElementById("detailTitle");

    const detailBody =
      document.getElementById("detailBody");

    const detailMeta =
      document.getElementById("detailMeta");

    const detailClose =
      document.getElementById("detailClose");

    const objectButtons =
      Array.from(
        document.querySelectorAll(
          ".found-object"
        )
      );

    let lastFocused = null;

    function openItem(itemKey) {
      const item = items[itemKey];

      if (!item) {
        return;
      }

      lastFocused =
        document.activeElement;

      detailTitle.textContent =
        item.title;

      detailBody.textContent =
        item.body;

      detailMeta.textContent =
        item.meta;

      detailPanel.classList.add(
        "show"
      );

      detailPanel.setAttribute(
        "aria-hidden",
        "false"
      );

      detailClose.focus();
    }

    function closeItem() {
      detailPanel.classList.remove(
        "show"
      );

      detailPanel.setAttribute(
        "aria-hidden",
        "true"
      );

      if (
        lastFocused &&
        typeof lastFocused.focus === "function"
      ) {
        lastFocused.focus();
      }
    }

    objectButtons.forEach((button) => {
      button.addEventListener(
        "click",
        () => {
          openItem(
            button.dataset.item
          );
        }
      );
    });

    detailClose.addEventListener(
      "click",
      closeItem
    );

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Escape" &&
          detailPanel.classList.contains(
            "show"
          )
        ) {
          closeItem();
        }
      }
    );
  </script>

</body>
</html>
