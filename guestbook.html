<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>guestbook ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Gaegu:wght@300;400;700&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 18px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo-wrap {
      width: 245px;
      max-width: 42vw;
    }

    .logo-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(850px, 88%);
      margin: auto;
      padding: 70px 0 90px;
    }

    .intro {
      text-align: center;
    }

    .tiny-label {
      color: var(--soft);
      font-size: 7px;
      letter-spacing: 3px;
    }

    h1 {
      margin-top: 8px;

      font-family: "Cormorant Garamond", serif;
      font-size: clamp(58px, 8vw, 86px);
      font-weight: 500;
      line-height: .95;
      letter-spacing: -2px;
    }

    .subtitle {
      width: min(500px, 90%);
      margin: 14px auto 0;

      color: #55514d;

      font-family: "Gaegu", cursive;
      font-size: 19px;
      line-height: 1.3;
    }

    .guestbook {
      width: min(620px, 100%);
      margin: 55px auto 0;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;

      font-family: "Gaegu", cursive;
      font-size: 17px;
    }

    .field {
      margin-bottom: 24px;
    }

    input,
    textarea {
      width: 100%;

      border: 0;
      border-bottom: 1px solid var(--ink);

      background: transparent;

      padding: 9px 2px;

      outline: none;

      font-family: "Gaegu", cursive;
      font-size: 20px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;

      border: 1px solid #aaa49d;

      padding: 13px;
    }

    input:focus {
      border-bottom-width: 2px;
    }

    textarea:focus {
      border-color: var(--ink);
    }

    .symbols {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .symbol {
      min-width: 42px;

      border: 1px solid #aaa49d;
      background: transparent;

      padding: 6px 10px;

      font-family: "Cormorant Garamond", serif;
      font-size: 18px;

      cursor: pointer;
    }

    .symbol:hover {
      transform: rotate(-2deg);
    }

    .symbol.selected {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .sign-row {
      margin-top: 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .sign-button {
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;

      padding: 4px 1px;

      font-family: "Gaegu", cursive;
      font-size: 20px;

      cursor: pointer;
    }

    .sign-button:hover {
      transform: rotate(-1deg);
    }

    .status {
      color: var(--soft);

      font-family: "Gaegu", cursive;
      font-size: 16px;
      text-align: right;
    }

    .entries {
      width: min(700px, 100%);
      margin: 70px auto 0;

      border-top: 1px solid var(--ink);
      padding-top: 26px;
    }

    .entries-title {
      margin-bottom: 25px;

      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      font-weight: 500;
    }

    .entry {
      padding: 24px 5px 26px;
      border-bottom: 1px solid #c9c4bd;
    }

    .entry-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    .entry-name {
      font-family: "Gaegu", cursive;
      font-size: 22px;
    }

    .entry-date {
      color: var(--soft);
      font-size: 7px;
      letter-spacing: .6px;
    }

    .entry-message {
      margin-top: 9px;

      font-family: "Gaegu", cursive;
      font-size: 20px;
      line-height: 1.35;
    }

    .entry-symbol {
      margin-left: 5px;

      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
    }

    .empty-note {
      color: var(--soft);

      font-family: "Gaegu", cursive;
      font-size: 18px;
    }

    .bottom {
      width: min(850px, 88%);
      margin: 0 auto 40px;
      padding-top: 18px;

      border-top: 1px solid var(--ink);

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .bottom-note {
      color: var(--soft);

      font-family: "Gaegu", cursive;
      font-size: 15px;
    }

    @media (max-width: 650px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo-wrap {
        width: 220px;
        max-width: 90%;
      }

      main {
        padding-top: 50px;
      }

      .sign-row,
      .entry-top,
      .bottom {
        align-items: flex-start;
      }

      .entry-top {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo-wrap">
      <img
        src="images/enokiecloud-logo.png"
        alt="enokiecloud"
        class="logo-image"
      >
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
    </div>

  </nav>

  <main>

    <section class="intro">

      <p class="tiny-label">
        LEAVE SOMETHING BEHIND
      </p>

      <h1>
        guestbook
      </h1>

      <p class="subtitle">
        u found my little corner of the internet ~ might as well say hi
      </p>

    </section>

    <section class="guestbook">

      <div class="field">

        <label
          for="name"
          class="form-label"
        >
          name / nickname
        </label>

        <input
          id="name"
          type="text"
          maxlength="30"
          autocomplete="off"
        >

      </div>

      <div class="field">

        <label
          for="message"
          class="form-label"
        >
          leave me something
        </label>

        <textarea
          id="message"
          maxlength="300"
        ></textarea>

      </div>

      <div class="field">

        <span class="form-label">
          pick a little thing
        </span>

        <div class="symbols">

          <button
            type="button"
            class="symbol selected"
            data-symbol="♡"
          >
            ♡
          </button>

          <button
            type="button"
            class="symbol"
            data-symbol="♥"
          >
            ♥
          </button>

          <button
            type="button"
            class="symbol"
            data-symbol="☁"
          >
            ☁
          </button>

          <button
            type="button"
            class="symbol"
            data-symbol="♫"
          >
            ♫
          </button>

          <button
            type="button"
            class="symbol"
            data-symbol="?"
          >
            ?
          </button>

        </div>

      </div>

      <div class="sign-row">

        <button
          type="button"
          class="sign-button"
          id="signButton"
        >
          sign the guestbook
        </button>

        <p
          class="status"
          id="status"
        >
          don't be weird pls
        </p>

      </div>

    </section>

    <section class="entries">

      <h2 class="entries-title">
        little notes people left
      </h2>

      <div id="entries">

        <p class="empty-note">
          nobody has written anything yet... awkward
        </p>

      </div>

    </section>

  </main>

  <div class="bottom">

    <a href="index.html">
      ← back home
    </a>

    <span class="bottom-note">
      thanks for stopping by ♡
    </span>

  </div>

  <script>
    const nameInput =
      document.getElementById("name");

    const messageInput =
      document.getElementById("message");

    const signButton =
      document.getElementById("signButton");

    const status =
      document.getElementById("status");

    const entries =
      document.getElementById("entries");

    const symbolButtons =
      document.querySelectorAll(".symbol");

    let selectedSymbol = "♡";

    const savedEntries =
      JSON.parse(
        localStorage.getItem("enokieGuestbookEntries") || "[]"
      );

    function getDate() {
      const now = new Date();

      return now.toLocaleDateString(
        "en-US",
        {
          month: "2-digit",
          day: "2-digit",
          year: "numeric"
        }
      );
    }

    function escapeHTML(text) {
      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    function renderEntries() {

      if (savedEntries.length === 0) {

        entries.innerHTML =
          '<p class="empty-note">nobody has written anything yet... awkward</p>';

        return;
      }

      entries.innerHTML =
        savedEntries
          .slice()
          .reverse()
          .map((entry) => {

            return `
              <article class="entry">

                <div class="entry-top">

                  <p class="entry-name">
                    ${escapeHTML(entry.name)}
                    <span class="entry-symbol">
                      ${escapeHTML(entry.symbol)}
                    </span>
                  </p>

                  <span class="entry-date">
                    ${escapeHTML(entry.date)}
                  </span>

                </div>

                <p class="entry-message">
                  ${escapeHTML(entry.message)}
                </p>

              </article>
            `;

          })
          .join("");
    }

    symbolButtons.forEach((button) => {

      button.addEventListener("click", () => {

        symbolButtons.forEach((other) => {
          other.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedSymbol =
          button.dataset.symbol;
      });

    });

    signButton.addEventListener("click", () => {

      const name =
        nameInput.value.trim();

      const message =
        messageInput.value.trim();

      if (!name) {

        status.textContent =
          "girl u forgot ur name";

        nameInput.focus();

        return;
      }

      if (!message) {

        status.textContent =
          "u gotta actually write something";

        messageInput.focus();

        return;
      }

      savedEntries.push({
        name: name,
        message: message,
        symbol: selectedSymbol,
        date: getDate()
      });

      localStorage.setItem(
        "enokieGuestbookEntries",
        JSON.stringify(savedEntries)
      );

      renderEntries();

      nameInput.value = "";
      messageInput.value = "";

      status.textContent =
        "ur officially part of the archive now ♡";
    });

    renderEntries();
  </script>

</body>
</html>
