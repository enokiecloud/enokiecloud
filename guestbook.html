<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>guestbook ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
      --line: #d8d3cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      color: inherit;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 18px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo-wrap {
      width: 245px;
      max-width: 42vw;
    }

    .logo-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(780px, 88%);
      margin: auto;
      padding: 68px 0 90px;
    }

    .intro {
      margin-bottom: 42px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(54px, 7vw, 76px);
      font-weight: 500;
      line-height: 1;
    }

    .subtitle {
      margin-top: 12px;

      color: var(--soft);

      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      font-style: italic;
    }

    .guestbook-form {
      border-top: 1px solid var(--ink);
      padding-top: 24px;
    }

    .field {
      margin-bottom: 26px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;

      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      font-weight: 500;
    }

    .helper {
      margin-top: -2px;
      margin-bottom: 9px;

      color: var(--soft);

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      line-height: 1.6;
    }

    input,
    textarea {
      width: 100%;

      background: transparent;

      outline: none;

      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      line-height: 1.7;
    }

    input {
      border: 0;
      border-bottom: 1px solid var(--line);

      padding: 7px 1px 9px;
    }

    input:focus {
      border-bottom-color: var(--ink);
    }

    textarea {
      min-height: 120px;

      border: 1px solid var(--line);

      padding: 11px;

      resize: vertical;
    }

    textarea:focus {
      border-color: var(--ink);
    }

    .sign-row {
      margin-top: 30px;
    }

    .sign-button {
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;

      padding: 2px 0;

      font-family: "Cormorant Garamond", serif;
      font-size: 18px;

      cursor: pointer;
    }

    .sign-button:hover {
      font-style: italic;
    }

    .sign-button:disabled {
      opacity: .5;
      cursor: default;
    }

    .status {
      margin-top: 10px;

      color: var(--soft);

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
    }

    .entries {
      margin-top: 52px;

      border-top: 1px solid var(--ink);
    }

    .entries-title {
      padding-top: 22px;

      font-family: "Cormorant Garamond", serif;
      font-size: 24px;
      font-weight: 500;
    }

    .entry {
      padding: 24px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .entry-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      font-weight: 500;
    }

    .entry-date {
      color: var(--soft);
      font-size: 7px;
    }

    .entry-message {
      margin-top: 9px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty-note,
    .loading-note {
      padding: 20px 0;

      color: var(--soft);

      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      font-style: italic;
    }

    .back {
      display: inline-block;

      margin-top: 42px;

      font-size: 10px;
    }

    .back:hover {
      font-style: italic;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo-wrap {
        width: 220px;
        max-width: 90%;
      }

      main {
        padding-top: 52px;
      }

      .entry-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo-wrap">
      <img
        src="images/enokiecloud-logo.png"
        alt="enokiecloud"
        class="logo-image"
      >
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
      <a href="guestbook.html">guestbook</a>
    </div>

  </nav>

  <main>

    <section class="intro">

      <h1>guestbook</h1>

      <p class="subtitle">
        leave me a little note if u were here ♡
      </p>

    </section>


    <section class="guestbook-form">

      <div class="field">

        <label
          for="name"
          class="form-label"
        >
          name / nickname
        </label>

        <input
          id="name"
          type="text"
          maxlength="30"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label
          for="message"
          class="form-label"
        >
          leave me something
        </label>

        <p class="helper">
          say hi, tell me something random, leave advice... whatever u want
        </p>

        <textarea
          id="message"
          maxlength="300"
        ></textarea>

      </div>


      <div class="sign-row">

        <button
          type="button"
          class="sign-button"
          id="signButton"
        >
          sign the guestbook
        </button>

        <p
          class="status"
          id="status"
        ></p>

      </div>

    </section>


    <section class="entries">

      <h2 class="entries-title">
        little notes people left
      </h2>

      <div id="entries">

        <p class="loading-note">
          opening the guestbook...
        </p>

      </div>

    </section>


    <a href="index.html" class="back">
      ← back home
    </a>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://szezeozsmdhlyibxhwqv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_k40X-XyTfxJ97f4_kkMTPQ_epBOcFAh";

    const { createClient } =
      supabase;

    const db =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const COOLDOWN_MS =
      60 * 1000;

    const COOLDOWN_KEY =
      "enokiecloudGuestbookLastSignedAt";

    let cooldownTimer =
      null;


    const nameInput =
      document.getElementById("name");

    const messageInput =
      document.getElementById("message");

    const signButton =
      document.getElementById("signButton");

    const status =
      document.getElementById("status");

    const entries =
      document.getElementById("entries");


    function formatDate(dateString) {

      const date =
        new Date(dateString);

      return date.toLocaleDateString(
        "en-US",
        {
          month: "2-digit",
          day: "2-digit",
          year: "numeric"
        }
      );
    }


    function createEntryElement(entry) {

      const article =
        document.createElement("article");

      article.className =
        "entry";


      const top =
        document.createElement("div");

      top.className =
        "entry-top";


      const name =
        document.createElement("p");

      name.className =
        "entry-name";

      name.textContent =
        entry.name;


      const date =
        document.createElement("span");

      date.className =
        "entry-date";

      date.textContent =
        formatDate(entry.created_at);


      const message =
        document.createElement("p");

      message.className =
        "entry-message";

      message.textContent =
        entry.message;


      top.appendChild(name);
      top.appendChild(date);

      article.appendChild(top);
      article.appendChild(message);

      return article;
    }


    async function loadEntries() {

      entries.innerHTML =
        '<p class="loading-note">opening the guestbook...</p>';


      const {
        data,
        error
      } =
        await db
          .from("guestbook")
          .select("id, name, message, created_at")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        entries.innerHTML =
          '<p class="empty-note">hmm... the guestbook is being weird rn</p>';

        return;
      }


      entries.innerHTML = "";


      if (!data || data.length === 0) {

        entries.innerHTML =
          '<p class="empty-note">nobody has written anything yet... awkward</p>';

        return;
      }


      data.forEach((entry) => {

        entries.appendChild(
          createEntryElement(entry)
        );

      });
    }


    function getCooldownRemaining() {

      const lastSignedAt =
        Number(
          localStorage.getItem(
            COOLDOWN_KEY
          ) || 0
        );

      const elapsed =
        Date.now() - lastSignedAt;

      return Math.max(
        0,
        COOLDOWN_MS - elapsed
      );
    }


    function updateCooldownDisplay() {

      const remaining =
        getCooldownRemaining();

      if (remaining <= 0) {

        signButton.disabled =
          false;

        if (
          status.textContent.startsWith(
            "wait "
          )
        ) {
          status.textContent =
            "";
        }

        if (cooldownTimer) {
          clearInterval(
            cooldownTimer
          );

          cooldownTimer =
            null;
        }

        return;
      }

      const seconds =
        Math.ceil(
          remaining / 1000
        );

      signButton.disabled =
        true;

      status.textContent =
        "wait " +
        seconds +
        "s before signing again";
    }


    function startCooldownTimer() {

      updateCooldownDisplay();

      if (cooldownTimer) {
        clearInterval(
          cooldownTimer
        );
      }

      cooldownTimer =
        setInterval(
          updateCooldownDisplay,
          250
        );
    }


    async function signGuestbook() {

      const remaining =
        getCooldownRemaining();

      if (remaining > 0) {

        startCooldownTimer();

        return;
      }


      const name =
        nameInput.value.trim();

      const message =
        messageInput.value.trim();


      if (!name) {

        status.textContent =
          "girl u forgot ur name";

        nameInput.focus();

        return;
      }


      if (!message) {

        status.textContent =
          "u gotta actually write something";

        messageInput.focus();

        return;
      }


      if (
        name.length > 30 ||
        message.length > 300
      ) {

        status.textContent =
          "okay that's a little too much writing";

        return;
      }


      signButton.disabled =
        true;

      status.textContent =
        "signing...";


      const {
        error
      } =
        await db
          .from("guestbook")
          .insert([
            {
              name: name,
              message: message
            }
          ]);


      signButton.disabled =
        false;


      if (error) {

        console.error(error);

        status.textContent =
          "wait it didn't save... try again";

        return;
      }


      nameInput.value =
        "";

      messageInput.value =
        "";

      status.textContent =
        "signed ♡";

      localStorage.setItem(
        COOLDOWN_KEY,
        String(Date.now())
      );

      startCooldownTimer();


      await loadEntries();
    }


    signButton.addEventListener(
      "click",
      signGuestbook
    );


    loadEntries();

    if (
      getCooldownRemaining() > 0
    ) {
      startCooldownTimer();
    }
  </script>

</body>
</html>
