<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>pet kitty ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
      --line: #d8d3cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 18px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo-wrap {
      width: 245px;
      max-width: 42vw;
    }

    .logo-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(820px, 88%);
      margin: auto;
      padding: 62px 0 90px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(52px, 8vw, 82px);
      font-weight: 500;
      line-height: 1;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--soft);
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
      font-style: italic;
    }

    .pet-stage {
      position: relative;
      margin: 34px auto 0;
      min-height: 470px;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .pet-wrap {
      position: absolute;
      left: 50%;
      bottom: 50px;
      transform: translateX(-50%);
      width: min(300px, 62vw);
      transition:
        transform .3s ease,
        bottom .3s ease;
      user-select: none;
    }

    .pet-wrap.wiggle {
      animation: wiggle .38s ease;
    }

    .pet-wrap.bounce {
      animation: bounce .45s ease;
    }

    .pet-wrap.sleepy {
      transform: translateX(-50%) rotate(3deg) scale(.98);
    }

    .pet-wrap.annoyed {
      transform: translateX(-50%) translateX(16px);
    }

    .pet-image {
      width: 100%;
      display: block;
      filter: contrast(1.03);
      -webkit-user-drag: none;
    }

    .speech {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(360px, 84%);
      text-align: center;
      min-height: 42px;

      font-family: "Cormorant Garamond", serif;
      font-size: 21px;
      font-style: italic;
      line-height: 1.3;
    }

    .tiny-status {
      position: absolute;
      right: 0;
      bottom: 14px;
      color: var(--soft);
      font-size: 7px;
      letter-spacing: .02em;
    }

    .meters {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .meter {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 8px;
      color: var(--soft);
    }

    .meter-track {
      margin-top: 7px;
      height: 3px;
      background: #ece8e2;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      background: var(--ink);
      width: 50%;
      transition: width .35s ease;
    }

    .actions {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px 22px;
    }

    .action-button {
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      padding: 2px 0;
      cursor: pointer;

      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
    }

    .action-button:hover {
      font-style: italic;
    }

    .action-button:disabled {
      opacity: .4;
      cursor: default;
    }

    .relationship {
      margin-top: 28px;
      text-align: center;
      color: var(--soft);
      font-size: 8px;
      line-height: 1.6;
    }

    .relationship strong {
      color: var(--ink);
      font-weight: 400;
    }

    .back {
      display: inline-block;
      margin-top: 42px;
      font-size: 10px;
    }

    .back:hover {
      font-style: italic;
    }

    @keyframes wiggle {
      0%   { transform: translateX(-50%) rotate(0deg); }
      25%  { transform: translateX(-50%) rotate(-3deg); }
      50%  { transform: translateX(-50%) rotate(3deg); }
      75%  { transform: translateX(-50%) rotate(-2deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }

    @keyframes bounce {
      0%   { transform: translateX(-50%) translateY(0); }
      40%  { transform: translateX(-50%) translateY(-14px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .logo-wrap {
        width: 220px;
        max-width: 90%;
      }

      main {
        padding-top: 50px;
      }

      .pet-stage {
        min-height: 410px;
      }

      .pet-wrap {
        width: min(245px, 68vw);
        bottom: 46px;
      }

      .speech {
        top: 24px;
        font-size: 19px;
      }

      .meters {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pet-wrap,
      .meter-fill {
        transition: none;
      }

      .pet-wrap.wiggle,
      .pet-wrap.bounce {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="logo-wrap">
      <img
        src="images/enokiecloud-logo.png"
        alt="enokiecloud"
        class="logo-image"
      >
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
      <a href="guestbook.html">guestbook</a>
    </div>
  </nav>

  <main>

    <section class="intro">
      <h1>pet kitty</h1>
      <p class="subtitle">
        it lives here now ♡
      </p>
    </section>

    <section class="pet-stage">
      <p class="speech" id="speech">
        just sitting here.
      </p>

      <div class="pet-wrap" id="petWrap">
        <img
          src="images/pet-neutral.png"
          alt="little black pet kitty"
          class="pet-image"
          id="petImage"
        >
      </div>

      <p class="tiny-status" id="tinyStatus">
        mood: suspicious
      </p>
    </section>

    <section class="meters" aria-label="pet status">

      <div class="meter">
        <div class="meter-label">
          <span>hunger</span>
          <span id="hungerValue">55</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill" id="hungerFill"></div>
        </div>
      </div>

      <div class="meter">
        <div class="meter-label">
          <span>mood</span>
          <span id="moodValue">50</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill" id="moodFill"></div>
        </div>
      </div>

      <div class="meter">
        <div class="meter-label">
          <span>energy</span>
          <span id="energyValue">60</span>
        </div>
        <div class="meter-track">
          <div class="meter-fill" id="energyFill"></div>
        </div>
      </div>

    </section>

    <section class="actions">
      <button class="action-button" type="button" data-action="feed">feed</button>
      <button class="action-button" type="button" data-action="pet">pet</button>
      <button class="action-button" type="button" data-action="play">play</button>
      <button class="action-button" type="button" data-action="bother">bother</button>
      <button class="action-button" type="button" data-action="sleep">sleep</button>
    </section>

    <p class="relationship">
      status with u: <strong id="bondLabel">stranger</strong>
    </p>

    <a href="index.html" class="back">
      ← back home
    </a>

  </main>

  <script>
    const STORAGE_KEY =
      "enokiecloudPetKittyStateV3";

    const DEFAULT_STATE = {
      hunger: 55,
      mood: 55,
      energy: 60,
      bond: 0,

      botherCount: 0,
      rapidActionCount: 0,
      lastActionAt: 0,

      feedCount: 0,
      petCount: 0,
      playCount: 0,

      sleeping: false,
      lastSeen: Date.now()
    };

    const speech =
      document.getElementById("speech");

    const tinyStatus =
      document.getElementById("tinyStatus");

    const petWrap =
      document.getElementById("petWrap");

    const hungerFill =
      document.getElementById("hungerFill");

    const moodFill =
      document.getElementById("moodFill");

    const energyFill =
      document.getElementById("energyFill");

    const hungerValue =
      document.getElementById("hungerValue");

    const moodValue =
      document.getElementById("moodValue");

    const energyValue =
      document.getElementById("energyValue");

    const bondLabel =
      document.getElementById("bondLabel");

    const buttons =
      Array.from(
        document.querySelectorAll(
          ".action-button"
        )
      );

    let state =
      loadState();

    function clamp(value) {
      return Math.max(
        0,
        Math.min(
          100,
          Math.round(value)
        )
      );
    }

    function loadState() {
      try {
        const saved =
          JSON.parse(
            localStorage.getItem(
              STORAGE_KEY
            )
          );

        if (!saved) {
          return {
            ...DEFAULT_STATE
          };
        }

        return {
          ...DEFAULT_STATE,
          ...saved
        };
      } catch (error) {
        return {
          ...DEFAULT_STATE
        };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(state)
        );
      } catch (error) {
        console.log(
          "pet state couldn't be saved"
        );
      }
    }

    function randomItem(items) {
      return items[
        Math.floor(
          Math.random() *
          items.length
        )
      ];
    }

    function animatePet(type) {
      petWrap.classList.remove(
        "wiggle",
        "bounce",
        "sleepy",
        "annoyed"
      );

      void petWrap.offsetWidth;

      if (type) {
        petWrap.classList.add(type);
      }

      if (
        type === "wiggle" ||
        type === "bounce"
      ) {
        setTimeout(() => {
          petWrap.classList.remove(type);
        }, 500);
      }
    }

    function getBondLabel() {
      if (state.bond >= 45) {
        return "attached";
      }

      if (state.bond >= 25) {
        return "kinda likes u";
      }

      if (state.bond >= 10) {
        return "tolerates u";
      }

      if (state.bond <= -10) {
        return "does not trust u";
      }

      return "stranger";
    }

    function getMoodLabel() {
      if (state.sleeping) {
        return "asleep";
      }

      if (state.mood <= 12) {
        return "actually mad";
      }

      if (state.mood <= 30) {
        return "irritated";
      }

      if (state.hunger >= 82) {
        return "hungry";
      }

      if (state.energy <= 18) {
        return "tired";
      }

      if (state.mood >= 78) {
        return "pretty happy";
      }

      return "suspicious";
    }

    function applyNaturalChanges() {
      const now =
        Date.now();

      const elapsedMinutes =
        Math.min(
          240,
          Math.max(
            0,
            (now - state.lastSeen) / 60000
          )
        );

      if (elapsedMinutes > 0) {
        state.hunger +=
          elapsedMinutes * 0.35;

        state.mood -=
          elapsedMinutes * 0.05;

        if (state.sleeping) {
          state.energy +=
            elapsedMinutes * 0.9;
        } else {
          state.energy -=
            elapsedMinutes * 0.12;
        }
      }

      state.lastSeen =
        now;
    }

    function updateUI() {
      state.hunger =
        clamp(state.hunger);

      state.mood =
        clamp(state.mood);

      state.energy =
        clamp(state.energy);

      hungerFill.style.width =
        state.hunger + "%";

      moodFill.style.width =
        state.mood + "%";

      energyFill.style.width =
        state.energy + "%";

      hungerValue.textContent =
        state.hunger;

      moodValue.textContent =
        state.mood;

      energyValue.textContent =
        state.energy;

      bondLabel.textContent =
        getBondLabel();

      tinyStatus.textContent =
        "mood: " +
        getMoodLabel();

      if (state.sleeping) {
        animatePet("sleepy");
      }

      saveState();
    }

    function trackActionPressure() {
      const now =
        Date.now();

      const gap =
        now - Number(state.lastActionAt || 0);

      if (gap < 2200) {
        state.rapidActionCount +=
          1;
      } else {
        state.rapidActionCount =
          Math.max(
            0,
            state.rapidActionCount - 2
          );
      }

      state.lastActionAt =
        now;
    }

    function getPressureReaction() {
      if (state.rapidActionCount >= 10) {
        return {
          line: randomItem([
            "DUDE.",
            "can u stop touching me for two seconds",
            "bro i'm getting irritated",
            "okay actually leave me alone",
            "why are u like this"
          ]),
          mood: -8,
          bond: -2,
          animation: "annoyed"
        };
      }

      if (state.rapidActionCount >= 7) {
        return {
          line: randomItem([
            "bruh...",
            "okay wait chill",
            "dude seriously",
            "ur doing a lot rn",
            "can i breathe"
          ]),
          mood: -5,
          bond: -1,
          animation: "annoyed"
        };
      }

      if (state.rapidActionCount >= 4) {
        return {
          line: randomItem([
            "uhh",
            "wait what are u doing",
            "okay okay",
            "girl i'm right here",
            "why are u clicking so fast"
          ]),
          mood: -2,
          bond: 0,
          animation: "wiggle"
        };
      }

      return null;
    }

    function maybeReactToPressure() {
      trackActionPressure();

      const reaction =
        getPressureReaction();

      if (!reaction) {
        return false;
      }

      speech.textContent =
        reaction.line;

      state.mood +=
        reaction.mood;

      state.bond +=
        reaction.bond;

      animatePet(
        reaction.animation
      );

      updateUI();

      return true;
    }

    function wakeIfNeeded() {
      if (!state.sleeping) {
        return false;
      }

      state.sleeping =
        false;

      speech.textContent =
        randomItem([
          "bro i was sleeping",
          "why.",
          "u woke me up???",
          "girl..."
        ]);

      state.mood -=
        7;

      animatePet("annoyed");

      updateUI();

      return true;
    }

    function feedPet() {
      if (maybeReactToPressure()) {
        return;
      }

      if (wakeIfNeeded()) {
        return;
      }

      state.feedCount +=
        1;

      if (state.hunger <= 15) {
        speech.textContent =
          randomItem([
            "bro i'm full",
            "again???",
            "girl.",
            "save it for later"
          ]);

        state.mood -=
          3;

        animatePet("wiggle");
      } else {
        speech.textContent =
          randomItem([
            "okay yum",
            "acceptable.",
            "wait... that's good",
            "fine u can feed me"
          ]);

        state.hunger -=
          24;

        state.mood +=
          4;

        state.energy +=
          2;

        state.bond +=
          2;

        animatePet("bounce");
      }

      updateUI();
    }

    function petPet() {
      if (maybeReactToPressure()) {
        return;
      }

      if (wakeIfNeeded()) {
        return;
      }

      state.petCount +=
        1;

      if (state.mood >= 92) {
        speech.textContent =
          randomItem([
            "okayyy enough affection",
            "i get it u love me",
            "fine fine",
            "ur clingy"
          ]);

        state.energy -=
          2;

        animatePet("wiggle");
      } else {
        speech.textContent =
          randomItem([
            "...okay",
            "don't get used to this",
            "hmm.",
            "fine. keep going.",
            "i'll allow it"
          ]);

        state.mood +=
          11;

        state.bond +=
          2;

        state.energy -=
          2;

        animatePet("wiggle");
      }

      updateUI();
    }

    function playPet() {
      if (maybeReactToPressure()) {
        return;
      }

      if (wakeIfNeeded()) {
        return;
      }

      state.playCount +=
        1;

      if (state.energy <= 12) {
        speech.textContent =
          randomItem([
            "absolutely not",
            "too tired",
            "maybe later",
            "look at me. no."
          ]);

        state.mood -=
          1;

        animatePet("annoyed");
      } else {
        speech.textContent =
          randomItem([
            "okay wait this is fun",
            "again again",
            "u almost got me",
            "i'm faster than u btw",
            "okayyy"
          ]);

        state.energy -=
          18;

        state.mood +=
          12;

        state.hunger +=
          10;

        state.bond +=
          3;

        animatePet("bounce");
      }

      updateUI();
    }

    function botherPet() {
      trackActionPressure();

      if (state.sleeping) {
        state.sleeping =
          false;
      }

      state.botherCount +=
        1;

      if (state.botherCount <= 2) {
        speech.textContent =
          randomItem([
            "uhh",
            "what",
            "did u need something",
            "why are u poking me"
          ]);

        state.mood -=
          2;

        animatePet("wiggle");
      } else if (state.botherCount <= 5) {
        speech.textContent =
          randomItem([
            "bruh",
            "dude...",
            "okay that's enough",
            "ur making me nervous",
            "why do u keep doing that"
          ]);

        state.mood -=
          5;

        state.bond -=
          1;

        animatePet("wiggle");
      } else if (state.botherCount <= 8) {
        speech.textContent =
          randomItem([
            "bro stop",
            "okay seriously",
            "can u chill",
            "i'm getting annoyed",
            "girl LEAVE me"
          ]);

        state.mood -=
          8;

        state.bond -=
          2;

        animatePet("annoyed");
      } else {
        speech.textContent =
          randomItem([
            "DUDE.",
            "i said stop",
            "ur actually irritating me",
            "leave me alone omg",
            "i literally live here"
          ]);

        state.mood -=
          12;

        state.bond -=
          3;

        animatePet("annoyed");
      }

      updateUI();
    }

    function sleepPet() {
      if (maybeReactToPressure()) {
        return;
      }

      if (state.sleeping) {
        speech.textContent =
          randomItem([
            "zzz",
            "still sleeping.",
            "girl let me sleep",
            "..."
          ]);

        state.energy +=
          3;

        updateUI();

        return;
      }

      speech.textContent =
        randomItem([
          "finally",
          "goodnight i guess",
          "don't wake me up",
          "zzz..."
        ]);

      state.sleeping =
        true;

      state.energy +=
        22;

      state.hunger +=
        4;

      animatePet("sleepy");

      updateUI();
    }

    function refreshPetOverTime() {
      applyNaturalChanges();
      updateUI();
    }

    buttons.forEach((button) => {
      button.addEventListener(
        "click",
        () => {
          const action =
            button.dataset.action;

          if (action === "feed") {
            feedPet();
          }

          if (action === "pet") {
            petPet();
          }

          if (action === "play") {
            playPet();
          }

          if (action === "bother") {
            botherPet();
          }

          if (action === "sleep") {
            sleepPet();
          }
        }
      );
    });

    applyNaturalChanges();

    if (
      state.bond >= 20 &&
      Math.random() < .28
    ) {
      speech.textContent =
        randomItem([
          "oh. ur back.",
          "took u long enough",
          "i wasn't waiting btw",
          "hi again"
        ]);
    }

    updateUI();

    setInterval(
      refreshPetOverTime,
      5000
    );
  </script>

</body>
</html>
