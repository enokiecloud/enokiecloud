<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>visitor pass ~ enokiecloud</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#f8f5ed;
  --card:#fdfbf6;
  --ink:#171717;
  --soft:#77736d;
  --line:#c9c4bb;
  --tape:#ddd3bc;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Nunito",sans-serif;
}
a{color:inherit;text-decoration:none}

header{
  width:min(1160px,91%);
  margin:auto;
  min-height:92px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
  border-bottom:1px solid var(--ink);
}
.logo{width:245px;max-width:42vw}
.logo img{display:block;width:100%}
nav{display:flex;gap:28px;flex-wrap:wrap}
nav a{font:11px "DM Mono",monospace}

main{width:min(930px,91%);margin:38px auto 85px}

/* clerk */
.welcome{
  min-height:180px;
  border:1.5px solid var(--ink);
  border-radius:25px;
  display:flex;
  align-items:flex-end;
  padding:20px 28px 0;
  overflow:hidden;
}
.clerk{
  width:225px;
  height:165px;
  object-fit:contain;
  object-position:bottom;
  filter:grayscale(1);
}
.speech{
  position:relative;
  flex:1;
  align-self:center;
  min-height:105px;
  padding:18px 28px;
  background:var(--card);
  border:1.5px solid var(--ink);
  border-radius:22px;
}
.speech:before{
  content:"";
  position:absolute;
  left:-13px;top:38px;
  width:23px;height:23px;
  background:var(--card);
  border-left:1.5px solid var(--ink);
  border-bottom:1.5px solid var(--ink);
  transform:rotate(45deg);
}
.speech strong{
  position:relative;z-index:2;
  display:block;
  font-size:34px;
  line-height:1;
}
.speech span{
  position:relative;z-index:2;
  display:block;
  margin-top:8px;
  font-size:19px;
}
.arrow{position:absolute;right:24px;bottom:15px}

/* pass */
.pass{
  position:relative;
  margin-top:20px;
  padding:34px 38px 30px;
  background:var(--card);
  border:2px solid var(--ink);
  border-radius:33px;
  box-shadow:5px 6px 0 #dfdcd5;
}
.pass:before{
  content:"";
  position:absolute;
  inset:9px;
  border:1px dotted rgba(0,0,0,.14);
  border-radius:25px;
  pointer-events:none;
}
.pass-head{
  position:relative;z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 6px 22px;
  border-bottom:1px dashed var(--line);
}
.pass-title{
  display:flex;
  align-items:center;
  gap:15px;
  font:500 21px/1.45 "DM Mono",monospace;
  letter-spacing:.13em;
}
.cloud{font-size:39px}
.head-cat{
  font:17px "Patrick Hand",cursive;
  transform:rotate(-2deg);
}

.pass-body{
  position:relative;z-index:2;
  display:grid;
  grid-template-columns:220px 1fr 170px;
  gap:28px;
  padding-top:28px;
}

/* profile */
.photo-wrap{position:relative}
.paperclip{
  position:absolute;
  z-index:5;
  left:-9px;top:-12px;
  width:23px;height:59px;
  border:3px solid var(--ink);
  border-radius:14px;
  transform:rotate(-11deg);
}
.paperclip:after{
  content:"";
  position:absolute;
  left:5px;top:7px;
  width:8px;height:38px;
  border:2px solid var(--ink);
  border-radius:10px;
}
.tape{
  position:absolute;
  z-index:4;
  right:-4px;top:-8px;
  width:68px;height:22px;
  background:rgba(221,211,188,.82);
  transform:rotate(9deg);
}
.tape:after{
  content:"♡";
  position:absolute;
  left:28px;top:0;
  font:17px "Patrick Hand",cursive;
  color:white;
}
.photo-card{
  padding:10px 10px 12px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#f5f2eb;
  transform:rotate(-.7deg);
}
.profile{
  display:block;
  width:100%;
  height:205px;
  object-fit:cover;
  object-position:center;
  border-radius:8px;
  filter:grayscale(1);
}
.caption{
  margin-top:7px;
  text-align:center;
  font:20px "Patrick Hand",cursive;
}
.barcode{
  height:42px;
  margin-top:12px;
  background:repeating-linear-gradient(
    90deg,
    var(--ink) 0 2px,
    transparent 2px 5px,
    var(--ink) 5px 6px,
    transparent 6px 10px
  );
  opacity:.8;
}

/* info */
.info{padding-top:2px}
.row{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:12px;
  padding:11px 4px;
  border-bottom:1px dashed var(--line);
}
.label{font-size:12px;color:#55514b}
.value{font:500 15px "DM Mono",monospace}

.personal{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:16px;
  padding:12px 15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#f5f2eb;
  font:16px "DM Mono",monospace;
}
.personal .catdot{
  width:18px;height:16px;
  background:var(--ink);
  border-radius:50% 50% 44% 44%;
  position:relative;
  flex:0 0 auto;
}
.personal .catdot:before,.personal .catdot:after{
  content:"";
  position:absolute;
  top:-5px;
  width:8px;height:8px;
  background:var(--ink);
  transform:rotate(45deg);
}
.personal .catdot:before{left:1px}
.personal .catdot:after{right:1px}

/* stamps */
.stamps{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.postage{
  position:relative;
  width:142px;
  min-height:150px;
  padding:13px 9px;
  border:2px dashed var(--ink);
  text-align:center;
  transform:rotate(-5deg);
  background:#f7f5ef;
}
.stamp-face{
  width:58px;height:52px;
  object-fit:cover;
  object-position:center;
  border-radius:50%;
  filter:grayscale(1);
}
.postage strong{
  display:block;
  margin-top:4px;
  font:500 11px/1.3 "DM Mono",monospace;
}
.cancel{
  position:absolute;
  right:-31px;top:80px;
  width:70px;
}
.cancel i{
  display:block;
  height:1px;
  margin:8px 0;
  background:var(--ink);
}
.resident{
  width:130px;height:130px;
  border:2px solid var(--ink);
  border-radius:50%;
  display:grid;
  place-items:center;
  text-align:center;
  transform:rotate(5deg);
  font:500 12px/1.5 "DM Mono",monospace;
}
.resident:before{
  content:"";
  position:absolute;
  width:114px;height:114px;
  border:1px dashed var(--ink);
  border-radius:50%;
}
.paws{
  font:20px "Patrick Hand",cursive;
  transform:rotate(-7deg);
}

/* bottom */
.back{
  display:inline-block;
  margin-top:25px;
  font:11px "DM Mono",monospace;
}

@media(max-width:780px){
  header{flex-direction:column;align-items:flex-start;padding:17px 0}
  .logo{width:220px;max-width:90%}
  .welcome{min-height:auto;padding:16px;align-items:center}
  .clerk{width:130px;height:130px}
  .speech{min-height:auto}
  .speech strong{font-size:27px}
  .speech span{font-size:16px}
  .pass{padding:29px 22px}
  .pass-head{align-items:flex-start}
  .pass-body{grid-template-columns:1fr}
  .photo-wrap{width:min(225px,100%);margin:auto}
  .stamps{flex-direction:row;justify-content:center;flex-wrap:wrap}
}
@media(max-width:500px){
  .welcome{display:block}
  .clerk{display:block;margin:auto}
  .speech:before{display:none}
  .pass-head{flex-direction:column;gap:8px}
  .pass-title{font-size:17px}
}
</style>
</head>

<body>
<header>
  <a class="logo" href="index.html">
    <img src="images/enokiecloud-logo.png" alt="enokiecloud">
  </a>
  <nav>
    <a href="index.html">home</a>
    <a href="memory-box.html">memory box</a>
    <a href="guestbook.html">guestbook</a>
  </nav>
</header>

<main>
  <section class="welcome">
    <img class="clerk" src="images/fortune-cat.png" alt="fortune cat">
    <div class="speech">
      <strong id="hello">oh hi</strong>
      <span id="hello2">lemme see...</span>
      <div class="arrow">▼</div>
    </div>
  </section>

  <section class="pass">
    <div class="pass-head">
      <div class="pass-title">
        <span class="cloud">☁</span>
        <span>ENOKIECLOUD<br>VISITOR PASS</span>
      </div>
      <div class="head-cat">cats only ♡</div>
    </div>

    <div class="pass-body">
      <div class="photo-wrap">
        <div class="paperclip"></div>
        <div class="tape"></div>

        <div class="photo-card">
          <img class="profile" src="images/visitor-profile.jpg" alt="visitor cat">
          <div class="caption" id="caption">nice to see u ♡</div>
        </div>

        <div class="barcode"></div>
      </div>

      <div class="info">
        <div class="row">
          <div class="label">visitor</div>
          <div class="value" id="visitorNo">#1</div>
        </div>

        <div class="row">
          <div class="label">cat type</div>
          <div class="value" id="catType">cloud cat</div>
        </div>

        <div class="row">
          <div class="label">vibe</div>
          <div class="value" id="vibe">softly chaotic</div>
        </div>

        <div class="row">
          <div class="label">first seen</div>
          <div class="value" id="firstSeen">09.14.26</div>
        </div>

        <div class="row">
          <div class="label">currently</div>
          <div class="value" id="currently">being nosy</div>
        </div>

        <div class="personal">
          <span class="catdot"></span>
          <span id="littleMessage">glad ur here ♡</span>
        </div>
      </div>

      <div class="stamps">
        <div class="postage">
          <img class="stamp-face" src="images/visitor-profile.jpg" alt="">
          <strong id="approval">CLOUD CAT<br>APPROVED</strong>
          <div>♡</div>
          <div class="cancel"><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="resident">
          ENOKIECLOUD<br>RESIDENT<br>♥
        </div>

        <div class="paws">ฅ^•ﻌ•^ฅ</div>
      </div>
    </div>
  </section>

  <a class="back" href="index.html">← back home</a>
</main>

<script>
const STORAGE_KEY = "enokiecloud_cat_pass_v2";
const SUPABASE_URL = "https://szezeozsmdhlyibxhwqv.supabase.co";
const SUPABASE_KEY = "sb_publishable_k40X-XyTfxJ97f4_kkMTPQ_epBOcFAh";

const catTypes = [
  "cloud cat",
  "window cat",
  "sleepy cat",
  "porch cat",
  "midnight cat",
  "tiny menace",
  "house cat",
  "internet cat",
  "nosy cat",
  "cozy cat",
  "rainy day cat",
  "little stray"
];

const vibes = [
  "softly chaotic",
  "quietly nosy",
  "sleepy but listening",
  "a little dramatic",
  "just vibing",
  "very curious",
  "kinda suspicious",
  "sweet n weird",
  "lowkey judging",
  "easily distracted",
  "doing their best",
  "probably hungry"
];

const statuses = [
  "being nosy",
  "looking around",
  "lurking",
  "just chilling",
  "wandering",
  "probably hungry",
  "avoiding responsibilities",
  "thinking about snacks",
  "doing nothing",
  "still looking around"
];

const messages = [
  "glad ur here ♡",
  "u can stay",
  "okay i like u",
  "approved hehe",
  "hi again ♡",
  "ur kinda cute",
  "welcome back",
  "don't cause problems",
  "i'll allow it",
  "come look around"
];

const captions = [
  "nice to see u ♡",
  "oh hello",
  "that's u hehe",
  "look at u",
  "very cute",
  "ur little id ♡",
  "yup that's u"
];

const pick = a => a[Math.floor(Math.random() * a.length)];

function dateStamp(){
  const d = new Date();
  return String(d.getMonth()+1).padStart(2,"0") + "." +
         String(d.getDate()).padStart(2,"0") + "." +
         String(d.getFullYear()).slice(-2);
}

function makeIdentity(){
  return {
    number: null,
    catType: pick(catTypes),
    vibe: pick(vibes),
    firstSeen: dateStamp(),
    currently: pick(statuses),
    message: pick(messages),
    caption: pick(captions),
    visits: 1
  };
}

async function getNewVisitorNumber(){
  const response = await fetch(SUPABASE_URL + "/rest/v1/visitors?select=id", {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    },
    body: JSON.stringify({})
  });

  if(!response.ok){
    throw new Error("visitor number request failed");
  }

  const rows = await response.json();

  if(!rows.length || !rows[0].id){
    throw new Error("no visitor number returned");
  }

  return rows[0].id;
}

function showIdentity(identity, returning){
  document.getElementById("visitorNo").textContent =
    identity.number ? "#" + identity.number : "#?";

  document.getElementById("catType").textContent = identity.catType;
  document.getElementById("vibe").textContent = identity.vibe;
  document.getElementById("firstSeen").textContent = identity.firstSeen;
  document.getElementById("currently").textContent = identity.currently;
  document.getElementById("littleMessage").textContent = identity.message;
  document.getElementById("caption").textContent = identity.caption;

  document.getElementById("approval").innerHTML =
    identity.catType.toUpperCase() + "<br>APPROVED";

  if(returning){
    document.getElementById("hello").textContent = "oh ur back";
    document.getElementById("hello2").textContent = "i remember u";
  } else {
    document.getElementById("hello").textContent = "oh hi";
    document.getElementById("hello2").textContent = "lemme see...";
  }
}

async function start(){
  let identity = null;
  let returning = false;

  try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      identity = JSON.parse(saved);
      returning = true;
      identity.visits = (identity.visits || 1) + 1;
      identity.currently = pick(statuses);
    } else {
      identity = makeIdentity();
      identity.number = await getNewVisitorNumber();
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(identity));
  } catch(error){
    console.error(error);

    if(!identity){
      identity = makeIdentity();
    }
  }

  showIdentity(identity, returning);
}

start();
</script>
</body>
</html>
