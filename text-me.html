<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>text me ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --paper: #fdfcf9;
      --ink: #111;
      --line: #d9d9d9;
      --incoming: #e9e9eb;
      --blue: #0b84ff;
      --muted: #8e8e93;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Cormorant Garamond", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* site header */

    header {
      padding: 34px 0 18px;
      border-bottom: 1px solid #111;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      width: 210px;
      display: block;
    }

    nav {
      display: flex;
      gap: 28px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
    }

    /* page */

    main {
      min-height: calc(100vh - 120px);

      display: flex;
      justify-content: center;

      padding: 48px 0 75px;
    }

    .feature {
      width: 390px;
      max-width: 100%;
    }

    .feature-top {
      margin-bottom: 10px;

      display: flex;
      justify-content: space-between;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      letter-spacing: .06em;
    }

    /* phone */

    .phone {
      width: 390px;
      max-width: 100%;
      height: 690px;

      background: white;

      border: 2px solid #111;
      border-radius: 44px;

      overflow: hidden;

      box-shadow: 7px 8px 0 #e7e6e1;

      display: flex;
      flex-direction: column;
    }

    /* ios-ish status */

    .status-bar {
      height: 31px;
      flex-shrink: 0;

      padding: 8px 21px 0;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 600;
    }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .signal {
      letter-spacing: -1px;
    }

    .battery {
      width: 18px;
      height: 8px;

      border: 1px solid #111;
      border-radius: 2px;

      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;

      left: 1px;
      top: 1px;

      width: 12px;
      height: 4px;

      background: #111;
    }

    .battery::after {
      content: "";
      position: absolute;

      right: -3px;
      top: 2px;

      width: 2px;
      height: 3px;

      background: #111;
      border-radius: 0 1px 1px 0;
    }

    /* imessage header */

    .contact-header {
      height: 76px;
      flex-shrink: 0;

      border-bottom: 1px solid #ececec;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ios-back {
      position: absolute;
      left: 18px;
      top: 27px;

      color: var(--blue);

      font-family: Arial, sans-serif;
      font-size: 26px;
      font-weight: 300;
    }

    .contact {
      text-align: center;
    }

    .contact-circle {
      width: 34px;
      height: 34px;

      margin: 0 auto 3px;

      border-radius: 50%;

      background: #d8d8dc;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 500;
    }

    .contact-name {
      display: inline-block;

      font-family: Arial, sans-serif;
      font-size: 10px;
      color: #111;
    }

    .contact-arrow {
      display: inline-block;
      margin-left: 2px;

      font-family: Arial, sans-serif;
      font-size: 9px;
      color: #999;
    }

    /* messages */

    .messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 16px 12px 18px;

      display: flex;
      flex-direction: column;
      gap: 3px;

      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #d4d4d4;
      border-radius: 20px;
    }

    .date {
      margin: 3px 0 15px;

      text-align: center;

      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: 500;
      color: var(--muted);
    }

    .message {
      width: fit-content;
      max-width: 78%;

      padding: 8px 11px;

      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.28;

      opacity: 0;
      transform: translateY(3px);

      animation: appear .18s ease forwards;
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .incoming {
      align-self: flex-start;

      background: var(--incoming);

      border-radius: 17px 17px 17px 5px;
    }

    .outgoing {
      align-self: flex-end;

      background: var(--blue);
      color: white;

      border-radius: 17px 17px 5px 17px;
    }

    .delivered {
      align-self: flex-end;

      margin: 0 4px 4px 0;

      font-family: Arial, sans-serif;
      font-size: 8px;
      color: var(--muted);
    }

    /* typing text */

    .typing-line {
      min-height: 20px;

      padding: 5px 16px 2px;

      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 9px;
      color: var(--muted);

      flex-shrink: 0;
    }

    .typing-line:empty {
      visibility: hidden;
    }

    /* replies */

    .reply-area {
      flex-shrink: 0;

      border-top: 1px solid #ededed;

      background: #fff;

      padding: 9px 10px 15px;
    }

    .reply-label {
      margin-bottom: 7px;

      text-align: center;

      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 8px;
      color: var(--muted);
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .choice {
      width: 100%;

      appearance: none;

      border: 1px solid #d5d5d8;
      border-radius: 16px;

      background: white;
      color: var(--blue);

      padding: 7px 9px;

      cursor: pointer;

      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 10px;

      transition: .12s ease;
    }

    .choice:hover {
      background: #f5f5f7;
      border-color: #bdbdc1;
    }

    .ending {
      text-align: center;

      font-family: "Cormorant Garamond", serif;
      font-size: 14px;
      font-style: italic;
    }

    .restart {
      display: block;

      margin: 8px auto 0;

      border: 0;
      background: transparent;

      cursor: pointer;

      font-family: "IBM Plex Mono", monospace;
      font-size: 8px;

      text-decoration: underline;
    }

    .leave {
      display: inline-block;

      margin-top: 17px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
    }

    @media (max-width: 650px) {

      .page {
        width: min(100% - 24px, 1040px);
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        flex-wrap: wrap;
        gap: 12px 20px;
      }

      main {
        padding-top: 30px;
      }

      .phone {
        height: 650px;
      }
    }
  </style>
</head>

<div class="page">

  <header>

    <nav>

</div>


<script>

const NUMBER =
  "+1 (415) 555-0138";

let contactDisplay = NUMBER;

/* persistent story memory */
const STORY_KEY = "enokiecloud_text_me_story_v8";
const COOLDOWN_MS = 5 * 1000;

function loadStory(){
  const base = {
    metK: false,
    chapter: 0,
    nextUnlockAt: 0,
    visitorName: "",
    himRead: "",
    pastLens: "",
    selfView: "",
    communicationStyle: "",
    memoryOrder: "",
    guiltAdvice: "",
    copingChoice: "",
    route: "",
    stayApproach: "",
    leaveMethod: "",
    boundaryStrength: "",
    finished: false,
    finalEnding: "",
    earlyByePending: false,
    transcript: []
  };

  try{
    return {
      ...base,
      ...JSON.parse(localStorage.getItem(STORY_KEY))
    };
  }catch{
    return base;
  }
}

let story = loadStory();

function saveStory(){
  localStorage.setItem(
    STORY_KEY,
    JSON.stringify(story)
  );
}

function rememberVisitorName(v){
  story.visitorName = v;
  saveStory();
}

function rememberTranscript(type, text, side = ""){
  if(!Array.isArray(story.transcript)){
    story.transcript = [];
  }

  story.transcript.push({
    type,
    text,
    side
  });

  saveStory();
}

const messages =
  document.getElementById("messages");

const choices =
  document.getElementById("choices");

const typingLine =
  document.getElementById("typingLine");

const replyLabel =
  document.getElementById("replyLabel");

const contactName =
  document.getElementById("contactName");

const contactCircle =
  document.getElementById("contactCircle");


/* helpers */

function wait(ms) {
  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


function scrollDown() {

  requestAnimationFrame(() => {

    messages.scrollTo({
      top: messages.scrollHeight,
      behavior: "smooth"
    });

  });
}


function addMessage(
  text,
  side = "incoming",
  persist = true
) {

  const bubble =
    document.createElement("div");

  bubble.className =
    "message " + side;

  bubble.textContent = text;

  messages.appendChild(bubble);

  if(persist){
    rememberTranscript(
      "message",
      text,
      side
    );
  }

  scrollDown();
}


function addDelivered(persist = true) {

  const delivered =
    document.createElement("div");

  delivered.className =
    "delivered";

  delivered.textContent =
    "Delivered";

  messages.appendChild(delivered);

  if(persist){
    rememberTranscript(
      "delivered",
      "Delivered"
    );
  }

  scrollDown();
}


const STORY_DATES = {
  1:  "Feb 7, 2026 · 10:42 PM",
  2:  "Feb 14, 2026 · 8:16 PM",
  3:  "Feb 22, 2026 · 12:08 AM",
  4:  "Mar 3, 2026 · 9:31 PM",
  5:  "Mar 12, 2026 · 11:17 PM",
  6:  "Mar 26, 2026 · 7:48 PM",
  7:  "Apr 8, 2026 · 1:06 AM",
  8:  "Apr 21, 2026 · 10:24 PM",
  9:  "May 5, 2026 · 6:39 PM",
  10: "May 21, 2026 · 11:52 PM",
  11: "Jun 3, 2026 · 9:14 PM",
  12: "Jun 15, 2026 · 12:27 AM",
  13: "Jun 27, 2026 · 8:41 PM",
  14: "Jun 30, 2026 · 10:03 PM"
};

function storyDateFor(chapterNumber){
  return (
    STORY_DATES[chapterNumber] ||
    STORY_DATES[14]
  );
}

function addDate(
  label = storyDateFor(1),
  persist = true
) {

  const date =
    document.createElement("div");

  date.className =
    "date";

  date.textContent =
    label;

  messages.appendChild(date);

  if(persist){
    rememberTranscript(
      "date",
      date.textContent
    );
  }
}

function addStoryDate(chapterNumber){
  addDate(
    storyDateFor(chapterNumber)
  );
}

function restoreTranscript(){

  messages.innerHTML = "";

  if(!Array.isArray(story.transcript)){
    story.transcript = [];
    return;
  }

  story.transcript.forEach(item => {

    if(item.type === "message"){
      addMessage(
        item.text,
        item.side || "incoming",
        false
      );
      return;
    }

    if(item.type === "delivered"){
      addDelivered(false);
      return;
    }

    if(item.type === "date"){
      const date =
        document.createElement("div");

      date.className =
        "date";

      date.textContent =
        item.text;

      messages.appendChild(date);
    }
  });

  scrollDown();
}


function typingName() {

  if (contactDisplay === NUMBER) {
    return NUMBER;
  }

  return contactDisplay;
}


function typingDelay(text) {

  const length =
    text.length;

  if (length <= 5) {
    return 950 + Math.random() * 450;
  }

  if (length <= 15) {
    return 1300 + Math.random() * 500;
  }

  if (length <= 35) {
    return 1700 + Math.random() * 650;
  }

  return 2200 + Math.random() * 850;
}


async function incoming(lines) {

  choices.innerHTML = "";

  for (let i = 0; i < lines.length; i++) {

    const text =
      lines[i];

    typingLine.textContent =
      typingName() + " is typing...";

    scrollDown();

    await wait(
      typingDelay(text)
    );

    typingLine.textContent = "";

    addMessage(
      text,
      "incoming"
    );

    if (i < lines.length - 1) {

      await wait(
        600 + Math.random() * 650
      );
    }
  }
}


function setChoices(options) {

  typingLine.textContent = "";

  choices.innerHTML = "";

  options.forEach(option => {

    const button =
      document.createElement("button");

    button.className =
      "choice";

    button.textContent =
      option.text;

    button.onclick =
      async () => {

        choices.innerHTML = "";

        addMessage(
          option.text,
          "outgoing"
        );

        await wait(300);

        if (Math.random() > .35) {
          addDelivered();
        }

        /*
          important:
          stranger does NOT immediately
          start replying
        */

        await wait(
          900 + Math.random() * 800
        );

        option.next();
      };

    choices.appendChild(button);
  });
}


/* start */

async function start() {

  /*
    Only a brand-new story starts with a blank phone.
    Once K has been met, transcript history is restored instead.
  */
  if(!story.transcript || story.transcript.length === 0){
    messages.innerHTML = "";
  }

  choices.innerHTML = "";
  typingLine.textContent = "";

  contactDisplay = NUMBER;

  contactName.textContent =
    NUMBER;

  contactCircle.textContent =
    "?";

  replyLabel.textContent =
    "choose a reply";

  addStoryDate(1);

  await wait(1000);

  await incoming([
    "bro"
  ]);

  await wait(800);

  await incoming([
    "answer me"
  ]);

  await wait(900);

  await incoming([
    "are u still coming"
  ]);

  setChoices([
    {
      text: "wrong number 😭",
      next: wrongNumber
    },
    {
      text: "who is this",
      next: whoIsThis
    },
    {
      text: "yeah im coming",
      next: pretend
    }
  ]);
}


/* wrong number */

async function wrongNumber() {

  await incoming([
    "oh shit"
  ]);

  await wait(700);

  await incoming([
    "WAIT"
  ]);

  await wait(800);

  await incoming([
    "LMAOO my bad"
  ]);

  await wait(1500);

  await incoming([
    "..."
  ]);

  await wait(1100);

  await incoming([
    "wait actually"
  ]);

  setChoices([
    {
      text: "actually what",
      next: askSomething
    },
    {
      text: "ur good lol",
      next: niceAboutIt
    },
    {
      text: "bye 😭",
      next: byeEarly
    }
  ]);
}


async function niceAboutIt() {

  await incoming([
    "thank u 😭"
  ]);

  await wait(1100);

  await incoming([
    "wait"
  ]);

  await wait(900);

  await incoming([
    "can i ask u something"
  ]);

  setChoices([
    {
      text: "why me 😭",
      next: whyMe
    },
    {
      text: "sure lol",
      next: setupStory
    },
    {
      text: "depends",
      next: depends
    }
  ]);
}


async function askSomething() {

  await incoming([
    "can i ask u something"
  ]);

  await wait(800);

  await incoming([
    "i need someone who literally doesn't know me"
  ]);

  setChoices([
    {
      text: "why me 😭",
      next: whyMe
    },
    {
      text: "okay go",
      next: setupStory
    },
    {
      text: "this sounds concerning",
      next: concerning
    }
  ]);
}

  await incoming([
    "idk"
  ]);

  await wait(800);

  await incoming([
    "u answered 😭"
  ]);

  await wait(950);

  await incoming([
    "and everyone i know is biased"
  ]);

  setChoices([
    {
      text: "okay fair",
      next: setupStory
    },
    {
      text: "terrible reasoning",
      next: terribleReason
    },
    {
      text: "fine im listening",

    }
  ]);
}


async function terribleReason() {

    "i know 😭"
  ]);

  await wait(700);

  await incoming([
    "but that's why ur perfect"
  ]);

  await wait(700);

  await incoming([
    "zero context"
  ]);

  setChoices([
    {
      text: "fine tell me",

    },
    {
      text: "okay that's kinda true",

    }

  await incoming([

  ]);

  await wait(700);

  await incoming([
    "nothing crazy"
  ]);

  await wait(800);

  await incoming([

  ]);

    {
      text: "oh im listening",

    },
    {

  ]);

  ]);

    {

    },
    {

/* who is this path */

  ]);

async function fairPoint() {

/* pretending path */

async function pretend() {

  await incoming([
    "finally"
  ]);

/*
  STORY STRUCTURE
  chapter 1  = wrong-number encounter + present-day setup
  chapter 2  = first night back together
  chapter 3  = why his "headspace" line hits so hard
  chapter 4  = what K actually regrets about three years ago
  chapter 5  = audience decides how K handles him now
  chapter 6  = he reaches out anyway
  chapter 7  = the saved texts + old voice messages
  chapter 8  = guilt vs patience
  chapter 9  = K notices her life shrinking around him
  chapter 10 = major route choice
  chapters 11-13 = route-specific endings
*/

function prepareKConversation(){
  choices.innerHTML = "";
  typingLine.textContent = "";

  contactDisplay = "K";
  contactName.textContent = "K";
  contactCircle.textContent = "K";

  replyLabel.textContent = "choose a reply";

  /*
    Do NOT clear messages here.
    Every new update stays underneath the old conversation.
  */
  addStoryDate(
    Math.min(
      story.chapter + 1,
      14
    )
  );
}

function formatCooldown(ms){
  const totalSeconds =
    Math.max(
      0,
      Math.ceil(ms / 1000)
    );

  const minutes =
    Math.floor(totalSeconds / 60);

  const seconds =
    totalSeconds % 60;

  if(minutes <= 0){
    return `${seconds}s`;
  }

  return `${minutes}m ${String(seconds).padStart(2,"0")}s`;
}

let cooldownTimer = null;

function renderCooldown(){

  if(cooldownTimer){
    clearInterval(cooldownTimer);
    cooldownTimer = null;
  }

  typingLine.textContent = "";
  choices.innerHTML = "";

  contactDisplay = "K";
  contactName.textContent = "K";
  contactCircle.textContent = "K";

  replyLabel.textContent =
    "k is offline";

  const ending =
    document.createElement("div");

  ending.className =
    "ending";

  choices.appendChild(ending);

  const restart =
    document.createElement("button");

  restart.className =
    "restart";

  restart.textContent =
    "check for update";

  restart.onclick =
    openTextMe;

  choices.appendChild(restart);

  function update(){
    const remaining =
      story.nextUnlockAt - Date.now();

    if(remaining <= 0){
      ending.textContent =
        "k can text again now.";

      restart.textContent =
        "open new message";

      if(cooldownTimer){
        clearInterval(cooldownTimer);
        cooldownTimer = null;
      }

      return;
    }

    ending.textContent =
      "k went offline ~ next update in " +
      formatCooldown(remaining);
  }

  update();

  cooldownTimer =
    setInterval(
      update,
      1000
    );
}

async function completeChapter(number, signoff){
  story.metK = true;
  story.chapter = number;
  story.nextUnlockAt =
    Date.now() + COOLDOWN_MS;

  saveStory();

  await wait(700);
  await incoming([signoff]);

  renderCooldown();
}

async function finishStory(finalEnding, finalLine){
  story.metK = true;
  story.finished = true;
  story.finalEnding = finalEnding;
  story.nextUnlockAt = 0;

  saveStory();

  await wait(850);
  endConversation(finalLine);
}

function playNextChapter(){
  const next = story.chapter + 1;

  if(next === 2){ chapterTwo(); return; }
  if(next === 3){ chapterThree(); return; }
  if(next === 4){ chapterFour(); return; }
  if(next === 5){ chapterFive(); return; }
  if(next === 6){ chapterSix(); return; }
  if(next === 7){ chapterSeven(); return; }
  if(next === 8){ chapterEight(); return; }
  if(next === 9){ chapterNine(); return; }
  if(next === 10){ chapterTen(); return; }

  if(next === 11){
    if(story.route === "stay"){ stayEleven(); return; }
    if(story.route === "leave"){ leaveEleven(); return; }
    if(story.route === "boundary"){ boundaryEleven(); return; }
  }

  if(next === 12){
    if(story.route === "stay"){ stayTwelve(); return; }
    if(story.route === "lateLeave"){ lateLeaveTwelve(); return; }
    if(story.route === "leave"){ leaveTwelve(); return; }
    if(story.route === "boundary"){ boundaryTwelve(); return; }
  }

  if(next === 13){
    if(story.route === "stay"){ stayThirteen(); return; }
    if(story.route === "lateLeave"){ lateLeaveThirteen(); return; }
    if(story.route === "leave"){ leaveThirteen(); return; }
    if(story.route === "boundary"){ boundaryThirteen(); return; }
  }

  postEnding();
}

/* ---------------- ROUTER ---------------- */

async function openTextMe(){
  story = loadStory();

  restoreTranscript();

  if(!story.metK){
    start();
    return;
  }

  if(story.finished){
    postEnding();
    return;
  }

  if(
    story.nextUnlockAt &&
    Date.now() < story.nextUnlockAt
  ){
    renderCooldown();
    return;
  }

  if(story.earlyByePending){
    earlyByeReturn();
    return;
  }

  playNextChapter();
}


/* ending */

function endConversation(text) {

  typingLine.textContent = "";

  replyLabel.textContent =
    "conversation ended";

  choices.innerHTML = "";

  const ending =
    document.createElement("div");

  ending.className =
    "ending";

  ending.textContent =
    text;

  choices.appendChild(ending);

  const restart =
    document.createElement("button");

  restart.className =
    "restart";

  restart.textContent =
    "check chat";

  restart.onclick =
    openTextMe;

  choices.appendChild(restart);
}


/* phone clock */

function updateClock() {

  const now =
    new Date();

  document.getElementById(
    "clock"
  ).textContent =
    now.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}

updateClock();

setInterval(
  updateClock,
  30000
);


/* go */

openTextMe();
