<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>text me ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --paper: #fdfcf9;
      --ink: #111;
      --soft: #efefec;
      --line: #d8d7d2;
      --muted: #777;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Cormorant Garamond", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* header */

    header {
      padding: 34px 0 18px;
      border-bottom: 1px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      width: 210px;
      display: block;
    }

    nav {
      display: flex;
      gap: 28px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
    }

    /* page */

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 0 70px;
    }

    .feature {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feature-label {
      width: 370px;
      max-width: 100%;
      margin-bottom: 10px;

      display: flex;
      justify-content: space-between;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      letter-spacing: .08em;
    }

    /* actual phone */

    .phone {
      width: 370px;
      max-width: 100%;
      height: 650px;

      border: 2px solid var(--ink);
      border-radius: 42px;

      background: #fff;
      overflow: hidden;

      box-shadow: 7px 8px 0 #e6e5e0;

      display: flex;
      flex-direction: column;
    }

    /* phone status */

    .phone-status {
      height: 30px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 7px 20px 0;

      font-family: "IBM Plex Mono", monospace;
      font-size: 8px;
    }

    .phone-icons {
      letter-spacing: 2px;
    }

    /* contact header */

    .contact-header {
      height: 67px;
      flex-shrink: 0;

      border-bottom: 1px solid var(--line);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    .back {
      position: absolute;
      left: 20px;
      top: 18px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 19px;
    }

    .contact {
      text-align: center;
    }

    .avatar {
      width: 29px;
      height: 29px;
      margin: 0 auto 2px;

      border: 1px solid var(--ink);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .contact-name {
      display: block;
      font-size: 13px;
      line-height: 1;
    }

    .contact-status {
      display: block;
      margin-top: 3px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      color: var(--muted);
    }

    /* message screen */

    .messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 22px 15px 18px;

      display: flex;
      flex-direction: column;
      gap: 5px;

      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #d1d0cc;
      border-radius: 10px;
    }

    .day {
      text-align: center;
      margin: 1px 0 15px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      color: #999;
    }

    .message {
      width: fit-content;
      max-width: 76%;

      padding: 8px 11px;

      border-radius: 16px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      line-height: 1.45;

      opacity: 0;
      transform: translateY(4px);

      animation: messageIn .18s ease forwards;
    }

    @keyframes messageIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .them {
      align-self: flex-start;
      background: var(--soft);
      border-bottom-left-radius: 5px;
    }

    .you {
      align-self: flex-end;
      background: var(--ink);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .typing {
      align-self: flex-start;

      background: var(--soft);
      border-radius: 16px;
      border-bottom-left-radius: 5px;

      padding: 7px 11px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      color: #777;
    }

    /* choices stay at bottom */

    .reply-panel {
      flex-shrink: 0;

      min-height: 112px;
      max-height: 160px;

      border-top: 1px solid var(--line);
      background: #fff;

      padding: 10px 12px 14px;

      overflow-y: auto;
    }

    .reply-label {
      margin-bottom: 8px;

      text-align: center;

      font-family: "IBM Plex Mono", monospace;
      font-size: 7px;
      color: #999;
      letter-spacing: .08em;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .choice {
      width: 100%;

      appearance: none;

      background: #fff;
      color: var(--ink);

      border: 1px solid #bdbcb8;
      border-radius: 15px;

      padding: 7px 10px;

      cursor: pointer;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      text-align: center;

      transition: .12s ease;
    }

    .choice:hover {
      border-color: var(--ink);
      background: #f6f5f1;
    }

    .end-text {
      text-align: center;

      font-family: "Cormorant Garamond", serif;
      font-size: 14px;
      font-style: italic;
    }

    .restart {
      display: block;

      margin: 10px auto 0;

      border: 0;
      background: none;

      padding: 0;

      cursor: pointer;

      font-family: "IBM Plex Mono", monospace;
      font-size: 8px;
      text-decoration: underline;
    }

    .leave {
      width: 370px;
      max-width: 100%;

      margin-top: 17px;

      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
    }

    @media (max-width: 650px) {
      .page {
        width: min(100% - 24px, 1040px);
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        flex-wrap: wrap;
        gap: 12px 20px;
      }

      main {
        padding-top: 30px;
      }

      .phone {
        height: 620px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header>

    <a href="index.html">
      <img
        src="images/enokiecloud-logo.png"
        class="logo"
        alt="enokiecloud"
      >
    </a>

    <nav>
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
      <a href="guestbook.html">guestbook</a>
    </nav>

  </header>

  <main>

    <div class="feature">

      <div class="feature-label">
        <span>TEXT ME</span>
        <span>wrong number</span>
      </div>

      <div class="phone">

        <div class="phone-status">
          <span id="phoneTime">8:23</span>
          <span class="phone-icons">•••</span>
        </div>

        <div class="contact-header">

          <span class="back">‹</span>

          <div class="contact">

            <div class="avatar">?</div>

            <span
              class="contact-name"
              id="contactName"
            >
              unknown
            </span>

            <span
              class="contact-status"
              id="contactStatus"
            >
              unknown number
            </span>

          </div>

        </div>

        <div
          class="messages"
          id="messages"
        ></div>

        <div class="reply-panel">

          <div
            class="reply-label"
            id="replyLabel"
          >
            reply
          </div>

          <div
            class="choices"
            id="choices"
          ></div>

        </div>

      </div>

      <a
        class="leave"
        href="index.html"
      >
        ← leave
      </a>

    </div>

  </main>

</div>


<script>

const messages =
  document.getElementById("messages");

const choices =
  document.getElementById("choices");

const replyLabel =
  document.getElementById("replyLabel");

const contactName =
  document.getElementById("contactName");

const contactStatus =
  document.getElementById("contactStatus");


/* utilities */

function scrollDown() {
  requestAnimationFrame(() => {
    messages.scrollTop =
      messages.scrollHeight;
  });
}


function addMessage(text, side = "them") {

  const bubble =
    document.createElement("div");

  bubble.className =
    "message " + side;

  bubble.textContent = text;

  messages.appendChild(bubble);

  scrollDown();
}


function addDay() {

  const day =
    document.createElement("div");

  day.className = "day";

  day.textContent = "today";

  messages.appendChild(day);
}


function wait(ms) {
  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


async function incoming(lines) {

  choices.innerHTML = "";

  for (const line of lines) {

    const typing =
      document.createElement("div");

    typing.className = "typing";
    typing.textContent = "...";

    messages.appendChild(typing);

    contactStatus.textContent =
      "typing...";

    scrollDown();

    await wait(
      350 + Math.random() * 300
    );

    typing.remove();

    contactStatus.textContent =
      "unknown number";

    addMessage(line);

    await wait(
      250 + Math.random() * 250
    );
  }
}


function setChoices(options) {

  choices.innerHTML = "";

  options.forEach(option => {

    const button =
      document.createElement("button");

    button.className = "choice";
    button.textContent = option.text;

    button.addEventListener(
      "click",
      async () => {

        choices.innerHTML = "";

        addMessage(
          option.text,
          "you"
        );

        await wait(300);

        option.next();
      }
    );

    choices.appendChild(button);
  });
}


/* beginning */

async function start() {

  messages.innerHTML = "";
  choices.innerHTML = "";

  contactName.textContent =
    "unknown";

  contactStatus.textContent =
    "unknown number";

  replyLabel.textContent =
    "reply";

  addDay();

  await wait(400);

  await incoming([
    "bro",
    "answer me",
    "are u still coming"
  ]);

  setChoices([
    {
      text: "wrong number 😭",
      next: wrongNumber
    },
    {
      text: "who is this",
      next: whoIsThis
    },
    {
      text: "yeah im coming",
      next: pretend
    }
  ]);
}


/* wrong number */

async function wrongNumber() {

  await incoming([
    "oh shit",
    "WAIT",
    "sorry LMAO"
  ]);

  await wait(450);

  await incoming([
    "...",
    "actually"
  ]);

  setChoices([
    {
      text: "actually what",
      next: actuallyWhat
    },
    {
      text: "LMAO ur good",
      next: youreGood
    },
    {
      text: "bye 😭",
      next: earlyBye
    }
  ]);
}


async function actuallyWhat() {

  await incoming([
    "can i ask u something",
    "i need someone who doesn't know me"
  ]);

  setChoices([
    {
      text: "why me 😭",
      next: whyMe
    },
    {
      text: "okay go",
      next: situation
    },
    {
      text: "this sounds dangerous",
      next: dangerous
    }
  ]);
}


async function youreGood() {

  await incoming([
    "thank u 😭",
    "wait",
    "since u answered",
    "can i ask u something"
  ]);

  setChoices([
    {
      text: "why me",
      next: whyMe
    },
    {
      text: "sure lol",
      next: situation
    },
    {
      text: "depends what it is",
      next: depends
    }
  ]);
}


async function whyMe() {

  await incoming([
    "idk",
    "u answered 😭",
    "everyone i know is biased"
  ]);

  setChoices([
    {
      text: "okay fair",
      next: situation
    },
    {
      text: "that's a terrible reason",
      next: terribleReason
    },
    {
      text: "im listening",
      next: situation
    }
  ]);
}


async function dangerous() {

  await incoming([
    "LMAOOO",
    "no omg",
    "nothing like that",
    "i just need an opinion"
  ]);

  setChoices([
    {
      text: "okayyy go",
      next: situation
    },
    {
      text: "im scared but okay",
      next: situation
    }
  ]);
}


async function depends() {

  await incoming([
    "relationship drama",
    "kinda",
    "don't judge me"
  ]);

  setChoices([
    {
      text: "oh im listening",
      next: situation
    },
    {
      text: "i will absolutely judge",
      next: judge
    },
    {
      text: "go ahead lol",
      next: situation
    }
  ]);
}


async function terribleReason() {

  await incoming([
    "i know 😭",
    "but ur literally perfect",
    "u have zero context"
  ]);

  setChoices([
    {
      text: "fine tell me",
      next: situation
    },
    {
      text: "okay that's kinda true",
      next: situation
    }
  ]);
}


async function judge() {

  await incoming([
    "okay fair",
    "but like",
    "quietly"
  ]);

  setChoices([
    {
      text: "no promises",
      next: situation
    },
    {
      text: "LMAO go",
      next: situation
    }
  ]);
}


/* who is this */

async function whoIsThis() {

  await incoming([
    "mina?",
    "...",
    "wait"
  ]);

  await incoming([
    "ur not mina"
  ]);

  setChoices([
    {
      text: "no 😭 who are YOU",
      next: whoAreYou
    },
    {
      text: "apparently not",
      next: apparentlyNot
    },
    {
      text: "maybe i am",
      next: maybeMina
    }
  ]);
}


async function whoAreYou() {

  await incoming([
    "YOU'RE asking ME??",
    "i texted the wrong number 😭"
  ]);

  setChoices([
    {
      text: "exactly so introduce urself",
      next: introduce
    },
    {
      text: "LMAOO",
      next: introduce
    },
    {
      text: "okay bye stranger",
      next: earlyBye
    }
  ]);
}


async function apparentlyNot() {

  await incoming([
    "omg sorry",
    "that's embarrassing"
  ]);

  setChoices([
    {
      text: "ur good lol",
      next: youreGood
    },
    {
      text: "extremely",
      next: embarrassing
    }
  ]);
}


async function embarrassing() {

  await incoming([
    "damn 😭",
    "okay deserved",
    "but wait"
  ]);

  setChoices([
    {
      text: "what now",
      next: actuallyWhat
    },
    {
      text: "oh god",
      next: actuallyWhat
    }
  ]);
}


async function maybeMina() {

  await incoming([
    "no",
    "absolutely not",
    "mina would've yelled at me already"
  ]);

  setChoices([
    {
      text: "maybe she's changed",
      next: changedMina
    },
    {
      text: "okay u got me",
      next: introduce
    }
  ]);
}


async function changedMina() {

  await incoming([
    "in the last 20 minutes??",
    "girl"
  ]);

  setChoices([
    {
      text: "anything is possible",
      next: playful
    },
    {
      text: "LMAOO okay fine",
      next: introduce
    }
  ]);
}


async function playful() {

  await incoming([
    "ur annoying",
    "i kinda respect it tho"
  ]);

  setChoices([
    {
      text: "thank u",
      next: introduce
    },
    {
      text: "as u should",
      next: introduce
    }
  ]);
}


async function introduce() {

  await incoming([
    "im not giving a random number my government name 😭",
    "u can call me m"
  ]);

  contactName.textContent = "m";

  setChoices([
    {
      text: "m is suspicious",
      next: suspicious
    },
    {
      text: "okay m",
      next: mContinue
    },
    {
      text: "im still calling u stranger",
      next: stranger
    }
  ]);
}


async function suspicious() {

  await incoming([
    "GOOD",
    "stranger danger",
    "anyway"
  ]);

  situation();
}


async function mContinue() {

  await incoming([
    "see we're friends now",
    "kinda"
  ]);

  situation();
}


async function stranger() {

  await incoming([
    "rude",
    "but fair"
  ]);

  situation();
}


/* pretending */

async function pretend() {

  await incoming([
    "finally",
    "did u bring it"
  ]);

  setChoices([
    {
      text: "bring what",
      next: caughtPretending
    },
    {
      text: "obviously",
      next: deeperPretend
    },
    {
      text: "no i forgot",
      next: forgot
    }
  ]);
}


async function caughtPretending() {

  await incoming([
    "...",
    "ur not mina",
    "LMAOOOO"
  ]);

  setChoices([
    {
      text: "u caught me",
      next: caught
    },
    {
      text: "who's mina 😭",
      next: whoIsThis
    }
  ]);
}


async function deeperPretend() {

  await incoming([
    "okay good",
    "because if u forgot the cat carrier AGAIN"
  ]);

  await wait(300);

  await incoming([
    "...",
    "wait",
    "what color is my cat"
  ]);

  setChoices([
    {
      text: "orange",
      next: orangeGuess
    },
    {
      text: "black",
      next: blackGuess
    },
    {
      text: "cat colored",
      next: catColored
    }
  ]);
}


async function orangeGuess() {

  await incoming([
    "WRONG",
    "WHO IS THIS 😭"
  ]);

  caught();
}


async function blackGuess() {

  await incoming([
    "...",
    "okay that's actually concerning",
    "but still wrong person"
  ]);

  caught();
}


async function catColored() {

  await incoming([
    "CAT COLORED???",
    "okay ur definitely not mina",
    "im crying"
  ]);

async function forgot() {

  await incoming([
    "MINA",
    "i swear to god"
  ]);

  await wait(400);

  await incoming([
    "...wait",
    "ur not mina are u"
  ]);

  setChoices([
    {
      text: "nope",

    {
      text: "surprise",

async function caught() {

  ]);

}

  await incoming([
    "okay it was kinda funny",
    "u scared me tho",
    "anyway wait"
  ]);

}


/* main conversation */

  await incoming([
    "okay",
    "so there's this guy"
  ]);

  await wait(300);

  await incoming([
    "we've been talking for like 2 months",
    "not dating",
    "but definitely not just friends"
  ]);

    {

      next: ohBrother
    },
    {

    {

}

    "DONT START",
    "i already know how it sounds 😭"
  ]);

  keepGoing();
}

  await incoming([
    "don't call it that",

  ]);

  keepGoing();
}


async function keepGoing() {

  await incoming([

    "yesterday he disappeared for like 8 hours"
  ]);

  await wait(300);

  await incoming([
    "then came back at 1am",
    "and texted me \"u up\""
  ]);

  setChoices([
    {
      text: "absolutely not",
      next: absolutelyNot
    },
    {
      text: "8 hours isn't that crazy",
      next: defendGuy
    },
    {

      next: whatDidYouSay
    }

async function absolutelyNot() {

  await incoming([
    "THANK U",
    "that's what i said"
  ]);

  await wait(300);

  await incoming([
    "well",
    "that's what i THOUGHT"
  ]);

      text: "oh no what did u actually say",

    },

    {

}


async function storyWatch() {

    "EXACTLY",

  ]);

}


async function stillDefending() {

  await incoming([
    "why are u defending this man",
    "u don't even know him 😭"
  ]);

  setChoices([
    {
      text: "im trying to be unbiased",
      next: unbiased
    },
    {
      text: "okay fine he's guilty",
      next: confession
    }
  ]);

async function unbiased() {

  await incoming([
    "okay fair",

  ]);

  confession();
}


async function whatDidYouSay() {

  await incoming([
    "...",
    "that's the problem"
  ]);

  setChoices([
    {
      text: "WHAT DID U SAY",
      next: confession
    },
    {

/* ending */

function endConversation(text) {

  contactStatus.textContent =
    "offline";

  replyLabel.textContent =
    "conversation ended";

  choices.innerHTML = "";

  const ending =
    document.createElement("div");

  ending.className = "end-text";
  ending.textContent = text;

  choices.appendChild(ending);

  const restart =
    document.createElement("button");

  restart.className = "restart";
  restart.textContent =
    "start over";

  restart.addEventListener(
    "click",
    start
  );

  choices.appendChild(restart);
}


/* clock */

function updateClock() {

  const now = new Date();

  document.getElementById(
    "phoneTime"
  ).textContent =
    now.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
}

updateClock();

setInterval(
  updateClock,
  30000
);


/* start */

start();
