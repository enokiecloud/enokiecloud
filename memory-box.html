<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>memory box ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 25px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo {
      font-family: "Cormorant Garamond", serif;
      font-size: 31px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(900px, 88%);
      margin: auto;
      padding: 80px 0 100px;
    }

    .intro {
      margin-bottom: 58px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(55px, 7vw, 78px);
      font-weight: 500;
      line-height: 1;
    }

    .subtitle {
      margin-top: 15px;

      color: var(--soft);

      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
      font-style: italic;
    }

    .archive {
      border-top: 1px solid var(--ink);
      padding-top: 15px;
    }

    .archive-item {
      min-height: 140px;
      padding: 30px 5px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      transition:
        padding-left .2s ease,
        padding-right .2s ease;
    }

    .archive-item:hover {
      padding-left: 14px;
      padding-right: 14px;
    }

    .archive-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1;
    }

    .archive-description {
      margin-top: 8px;

      color: var(--soft);

      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      font-style: italic;
    }

    .arrow {
      font-family: "Cormorant Garamond", serif;
      font-size: 24px;

      transition: transform .2s ease;
    }

    .archive-item:hover .arrow {
      transform: translate(4px, -4px);
    }

    .back {
      display: inline-block;
      margin-top: 45px;

      font-size: 10px;
    }

    .back:hover {
      font-style: italic;
    }

    @media (max-width: 650px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      main {
        padding-top: 55px;
      }

      .archive-item {
        min-height: 120px;
      }

      .archive-title {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo">
      enokiecloud ♡
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
    </div>

  </nav>

  <main>

    <section class="intro">

      <h1>memory box</h1>

      <p class="subtitle">
        little things i used to love, remember, or still think about
      </p>

    </section>

    <section class="archive">

      <a href="archie-comics.html" class="archive-item">

        <div>
          <h2 class="archive-title">archie comics</h2>

          <p class="archive-description">
            some of the comics i loved growing up
          </p>
        </div>

        <span class="arrow">↗</span>

      </a>

      <a href="kitchen-notes.html" class="archive-item">

        <div>
          <h2 class="archive-title">kitchen notes</h2>

          <p class="archive-description">
            little notes from things i’ve made
          </p>
        </div>

        <span class="arrow">↗</span>

      </a>

    </section>

    <a href="index.html" class="back">
      ← back home
    </a>

  </main>

</body>
</html>
