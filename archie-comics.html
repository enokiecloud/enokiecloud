<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>archie comics ~ enokiecloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --paper: #fdfcf9;
      --ink: #111111;
      --soft: #77736e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      width: min(1200px, 90%);
      margin: auto;
      padding: 25px 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid var(--ink);
    }

    .logo {
      font-family: "Cormorant Garamond", serif;
      font-size: 31px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      font-family: "Cormorant Garamond", serif;
      font-size: 17px;
    }

    .nav-links a:hover {
      font-style: italic;
    }

    main {
      width: min(1050px, 88%);
      margin: auto;
      padding: 78px 0 100px;
    }

    .intro {
      margin-bottom: 52px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(55px, 7vw, 78px);
      font-weight: 500;
      line-height: 1;
    }

    .subtitle {
      margin-top: 15px;

      color: var(--soft);

      font-family: "Cormorant Garamond", serif;
      font-size: 19px;
      font-style: italic;
    }

    .comic-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 42px 32px;
      align-items: start;
    }

    .comic {
      display: block;
      position: relative;
    }

    .comic-cover {
      display: block;
      width: 100%;
      height: auto;

      transition:
        transform .25s ease,
        filter .25s ease;
    }

    .comic:hover .comic-cover {
      transform: translateY(-5px) rotate(-0.3deg);
      filter: contrast(1.02);
    }

    .comic:nth-child(even):hover .comic-cover {
      transform: translateY(-5px) rotate(0.3deg);
    }

    .back {
      display: inline-block;
      margin-top: 58px;

      font-size: 10px;
    }

    .back:hover {
      font-style: italic;
    }

    @media (max-width: 800px) {
      .comic-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 32px 24px;
      }
    }

    @media (max-width: 520px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      main {
        padding-top: 55px;
      }

      .comic-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo">
      enokiecloud ♡
    </a>

    <div class="nav-links">
      <a href="index.html">home</a>
      <a href="memory-box.html">memory box</a>
    </div>

  </nav>

  <main>

    <section class="intro">

      <h1>archie comics</h1>

      <p class="subtitle">
        some of the comics i loved growing up
      </p>

    </section>

    <section class="comic-grid">

      <div class="comic">
        <img class="comic-cover" src="images/archie1" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie2" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie3" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie4" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie5" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie6" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie7" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie8" alt="archie comic cover">
      </div>

      <div class="comic">
        <img class="comic-cover" src="images/archie9" alt="archie comic cover">
      </div>

    </section>

    <a href="memory-box.html" class="back">
      ← back to memory box
    </a>

  </main>

</body>
</html>
